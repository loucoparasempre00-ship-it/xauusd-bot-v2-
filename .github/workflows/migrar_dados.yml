name: Migrar Estrutura de Dados

on:
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Executar migracao
        run: python migrar_agora.py
      - name: Salvar novas pastas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/
          git commit -m "Organiza pasta data nos 6 modulos" || exit 0
          git push
