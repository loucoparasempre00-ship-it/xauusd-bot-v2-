name: Testes dos Modulos V2

on:
push:
workflow_dispatch:

jobs:
testar:
runs-on: ubuntu-latest

steps:
  - name: Baixar codigo do repositorio
    uses: actions/checkout@v4

  - name: Preparar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Conferir arquivos
    run: |
      pwd
      ls -la
      python --version

  - name: Executar todos os testes
    run: python -m unittest discover -v
