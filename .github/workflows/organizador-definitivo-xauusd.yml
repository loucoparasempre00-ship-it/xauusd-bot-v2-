
name: Organizador XAUUSD

on:
  workflow_run:
    workflows:
      - "Condutor de Operacoes XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: organizador-xauusd
  cancel-in-progress: false

jobs:
  organizar:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar codigo Python
        run: |
          set -euo pipefail
          python -m py_compile organizador_migracao_xauusd.py

      - name: Executar Organizador
        run: |
          set -euo pipefail
          python -u organizador_migracao_xauusd.py

      - name: Validar seis bancos e códigos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          import sqlite3
          from pathlib import Path

          grupos = {
              "graficos.db": "graficos",
              "sinais.db": "sinais",
              "memoria.db": "memoria",
              "operacoes.db": "operacoes",
              "estatisticas_m5.db": "estatisticas_m5",
              "resultados_operacoes.db": "resultados_operacoes",
          }

          for nome, tabela in grupos.items():
              caminho = Path("data") / nome

              if not caminho.is_file():
                  raise SystemExit(f"Banco ausente: {nome}")

              con = sqlite3.connect(caminho)

              integridade = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

              tabelas = {
                  linha[0]
                  for linha in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

              obrigatorias = {
                  tabela,
                  "arquivos_origem",
                  "controle_importacao",
                  "referencias_modulos",
                  "duplicatas_registros",
              }

              if nome == "operacoes.db":
                  obrigatorias.add("controle_codigos_operacoes")

              faltando = obrigatorias - tabelas

              if faltando:
                  raise SystemExit(
                      f"{nome}: tabelas ausentes: {sorted(faltando)}"
                  )

              total = con.execute(
                  f"SELECT COUNT(*) FROM {tabela}"
              ).fetchone()[0]

              origens = con.execute(
                  "SELECT COUNT(*) FROM arquivos_origem"
              ).fetchone()[0]

              if nome != "operacoes.db" and origens < 1:
                  raise SystemExit(
                      f"Nenhum arquivo de origem em {nome}"
                  )

              if integridade != "ok":
                  raise SystemExit(
                      f"Falha de integridade: {nome}"
                  )

              if nome == "operacoes.db":
                  linhas = con.execute(
                      "SELECT payload_json FROM operacoes"
                  ).fetchall()

                  codigos = set()

                  for (texto,) in linhas:
                      item = json.loads(texto)
                      codigo = item.get("codigo_operacao")

                      if not codigo or not re.fullmatch(
                          r"OP-[0-9]{6,}", str(codigo)
                      ):
                          raise SystemExit(
                              f"Código inválido em {nome}: {codigo}"
                          )

                      if codigo in codigos:
                          raise SystemExit(
                              f"Código duplicado: {codigo}"
                          )

                      codigos.add(codigo)

                      if item.get("status") != "ATIVA":
                          raise SystemExit(
                              f"Operação não ativa em {nome}: {codigo}"
                          )

                  print(
                      f"OK: {nome} | operações ativas={total}"
                  )
              else:
                  print(
                      f"OK: {nome} | registros={total} | origens={origens}"
                  )

              con.close()

          relatorio = Path(
              "data/relatorio_organizador_xauusd.json"
          )

          if not relatorio.is_file():
              raise SystemExit("Relatorio nao encontrado")

          dados = json.loads(
              relatorio.read_text(encoding="utf-8")
          )

          if dados.get("status") != "SUCESSO":
              raise SystemExit(
                  "Organizador nao terminou com SUCESSO"
              )

          if dados.get("total_erros", 0) != 0:
              raise SystemExit("Relatorio apresenta erros")

          if dados.get("total_arquivos_sem_grupo", 0) != 0:
              raise SystemExit(
                  "Existem arquivos sem classificacao"
              )

          print("SEIS_BANCOS_VALIDOS")
          print("CODIGOS_OPERACOES_VALIDOS")
          print("RELATORIO_VALIDADO")
          PY

      - name: Salvar bancos no repositorio
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/graficos.db \
            data/sinais.db \
            data/memoria.db \
            data/operacoes.db \
            data/estatisticas_m5.db \
            data/resultados_operacoes.db \
            data/relatorio_organizador_xauusd.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos bancos."
          else
            git commit -m "Organizador XAUUSD: codificar e conferir operacoes"
            git push origin HEAD:main
          fi

      - name: Guardar copia de validacao
        uses: actions/upload-artifact@v4
        with:
          name: organizador-xauusd-validado
          path: |
            data/graficos.db
            data/sinais.db
            data/memoria.db
            data/operacoes.db
            data/estatisticas_m5.db
            data/resultados_operacoes.db
            data/relatorio_organizador_xauusd.json
          retention-days: 30
