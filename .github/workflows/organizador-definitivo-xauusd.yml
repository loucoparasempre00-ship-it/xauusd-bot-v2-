
name: Organizador XAUUSD

on:
  workflow_run:
    workflows:
      - "Condutor de Operacoes XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: organizador-xauusd
  cancel-in-progress: false

jobs:
  migrar:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar migracao
        run: |
          set -euo pipefail
          python -m py_compile organizador_migracao_xauusd.py
          python -u organizador_migracao_xauusd.py

      - name: Validar quatro bancos
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          nomes = [
              "graficos.db",
              "sinais.db",
              "memoria.db",
              "operacoes.db"
          ]

          for nome in nomes:
              caminho = Path("data") / nome

              if not caminho.is_file():
                  raise SystemExit(f"Banco ausente: {nome}")

              con = sqlite3.connect(caminho)

              integridade = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

              total = con.execute(
                  "SELECT COUNT(*) FROM origens"
              ).fetchone()[0]

              con.close()

              if integridade != "ok" or total < 1:
                  raise SystemExit(
                      f"Banco invalido: {nome}"
                  )

              print(f"OK: {nome} - {total} arquivos")

          print("QUATRO_BANCOS_VALIDOS")
          PY

      - name: Salvar bancos no repositorio
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/graficos.db \
            data/sinais.db \
            data/memoria.db \
            data/operacoes.db \
            relatorio_migracao_xauusd.json

          if git diff --cached --quiet; then
            echo "Bancos ja atualizados."
          else
            git commit -m \
              "Migrar XAUUSD para quatro bancos SQLite"
            git push origin HEAD:main
          fi

      - name: Guardar copia de validacao
        uses: actions/upload-artifact@v4
        with:
          name: migracao-xauusd-validada
          path: |
            data/graficos.db
            data/sinais.db
            data/memoria.db
            data/operacoes.db
            relatorio_migracao_xauusd.json
          retention-days: 30
