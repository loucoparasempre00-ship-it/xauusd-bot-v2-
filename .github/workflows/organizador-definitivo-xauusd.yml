
name: Organizador XAUUSD

on:
  workflow_run:
    workflows:
      - "Memoria Persistente XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: organizador-xauusd
  cancel-in-progress: false

jobs:
  organizar:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar GitHub CLI
        run: |
          gh --version

      - name: Conferir os arquivos
        run: |
          set -euo pipefail
          python -m py_compile coletor_xauusd.py
          python -m py_compile organizador_migracao_xauusd.py

      - name: Executar Coletor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -u coletor_xauusd.py

      - name: Executar Organizador
        run: |
          set -euo pipefail
          python -u organizador_migracao_xauusd.py

      - name: Validar seis bancos
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import json
          import sqlite3
          import tempfile
          from pathlib import Path

          bancos = {
              "graficos.db.gz": "graficos",
              "sinais.db.gz": "sinais",
              "memoria.db.gz": "memoria",
              "operacoes.db.gz": "operacoes",
              "estatisticas_m5.db.gz": "estatisticas_m5",
              "resultados_operacoes.db.gz": "resultados_operacoes",
          }

          for nome, tabela in bancos.items():
              caminho = Path("data") / nome

              if not caminho.is_file():
                  raise SystemExit(f"Banco ausente: {nome}")

              conteudo = gzip.decompress(caminho.read_bytes())

              with tempfile.NamedTemporaryFile(suffix=".db") as temp:
                  temp.write(conteudo)
                  temp.flush()

                  con = sqlite3.connect(temp.name)

                  integridade = con.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()[0]

                  if integridade != "ok":
                      raise SystemExit(
                          f"Falha de integridade: {nome}"
                      )

                  total = con.execute(
                      f"SELECT COUNT(*) FROM {tabela}"
                  ).fetchone()[0]

                  if nome == "operacoes.db.gz":
                      linhas = con.execute(
                          "SELECT payload_json FROM operacoes"
                      ).fetchall()

                      codigos = set()

                      for (texto,) in linhas:
                          item = json.loads(texto)

                          if item.get("status") != "ATIVA":
                              raise SystemExit(
                                  "Operação encerrada encontrada "
                                  "no banco de operações ativas"
                              )

                          codigo = item.get("codigo_operacao")

                          if not codigo or not str(codigo).startswith("OP-"):
                              raise SystemExit(
                                  f"Código inválido: {codigo}"
                              )

                          if codigo in codigos:
                              raise SystemExit(
                                  f"Código repetido: {codigo}"
                              )

                          codigos.add(codigo)

                  print(
                      f"OK: {nome} | registros={total} "
                      f"| integridade={integridade}"
                  )

                  con.close()

          relatorio = Path(
              "data/relatorio_organizador_xauusd.json"
          )

          if not relatorio.is_file():
              raise SystemExit("Relatório não encontrado")

          dados = json.loads(
              relatorio.read_text(encoding="utf-8")
          )

          if dados.get("status") != "SUCESSO":
              raise SystemExit(
                  "Organizador terminou com pendências"
              )

          if dados.get("operacoes_ativas") is None:
              raise SystemExit(
                  "Quantidade de operações ativas não informada"
              )

          print("SEIS BANCOS VALIDADOS")
          print("OPERAÇÕES ATIVAS:", dados["operacoes_ativas"])
          PY

      - name: Salvar bancos
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            data/graficos.db.gz \
            data/sinais.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/estatisticas_m5.db.gz \
            data/resultados_operacoes.db.gz \
            data/relatorio_organizador_xauusd.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos bancos."
          else
            git commit -m "Organizador XAUUSD: coleta e bancos"
            git push origin HEAD:main
          fi

      - name: Guardar validacao
        uses: actions/upload-artifact@v4
        with:
          name: organizador-xauusd-validado
          path: |
            data/graficos.db.gz
            data/sinais.db.gz
            data/memoria.db.gz
            data/operacoes.db.gz
            data/estatisticas_m5.db.gz
            data/resultados_operacoes.db.gz
            data/relatorio_organizador_xauusd.json
          retention-days: 30
