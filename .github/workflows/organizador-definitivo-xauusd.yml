
name: Organizador XAUUSD

on:
  workflow_run:
    workflows:
      - "Memoria Persistente XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: organizador-xauusd
  cancel-in-progress: false

jobs:
  organizar:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir sintaxe
        run: |
          set -euo pipefail
          python -m py_compile coletor_xauusd.py
          python -m py_compile organizador_migracao_xauusd.py

      - name: Executar Coletor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u coletor_xauusd.py

      - name: Executar Organizador
        run: |
          python -u organizador_migracao_xauusd.py

      - name: Validar seis bancos e relatorio
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import json
          import sqlite3
          import tempfile
          from pathlib import Path

          bancos = {
              "graficos.db.gz": "graficos",
              "sinais.db.gz": "sinais",
              "memoria.db.gz": "memoria",
              "operacoes.db.gz": "operacoes",
              "estatisticas_m5.db.gz": "estatisticas_m5",
              "resultados_operacoes.db.gz": "resultados_operacoes",
          }

          falhas = []

          for nome, tabela in bancos.items():
              caminho = Path("data") / nome

              if not caminho.is_file():
                  falhas.append(f"Banco ausente: {nome}")
                  print("[ERRO] Banco ausente:", nome)
                  continue

              try:
                  conteudo = gzip.decompress(caminho.read_bytes())

                  with tempfile.NamedTemporaryFile(suffix=".db") as temp:
                      temp.write(conteudo)
                      temp.flush()

                      con = sqlite3.connect(temp.name)

                      integridade = con.execute(
                          "PRAGMA integrity_check"
                      ).fetchone()[0]

                      total = con.execute(
                          f"SELECT COUNT(*) FROM {tabela}"
                      ).fetchone()[0]

                      if integridade != "ok":
                          falhas.append(
                              f"Falha de integridade: {nome}"
                          )

                      if nome == "operacoes.db.gz":
                          linhas = con.execute(
                              "SELECT payload_json FROM operacoes"
                          ).fetchall()

                          codigos = set()

                          for (texto,) in linhas:
                              item = json.loads(texto)

                              if item.get("status") != "ATIVA":
                                  falhas.append(
                                      "Operacao nao ativa no banco de ativas."
                                  )

                              codigo = item.get("codigo_operacao")

                              if (
                                  not codigo
                                  or not str(codigo).startswith("OP-")
                              ):
                                  falhas.append(
                                      f"Codigo invalido: {codigo}"
                                  )

                              if codigo in codigos:
                                  falhas.append(
                                      f"Codigo repetido: {codigo}"
                                  )

                              codigos.add(codigo)

                      print(
                          f"[{'OK' if integridade == 'ok' else 'ERRO'}] "
                          f"{nome} | registros={total} "
                          f"| integridade={integridade}"
                      )

                      con.close()

              except Exception as erro:
                  falhas.append(
                      f"{nome}: {type(erro).__name__}: {erro}"
                  )
                  print("[ERRO]", nome, erro)

          caminho_relatorio = Path(
              "data/relatorio_organizador_xauusd.json"
          )

          if not caminho_relatorio.is_file():
              falhas.append("Relatorio do Organizador ausente.")
              dados = {}
          else:
              try:
                  dados = json.loads(
                      caminho_relatorio.read_text(encoding="utf-8")
                  )
              except Exception as erro:
                  falhas.append(
                      f"Relatorio invalido: {type(erro).__name__}: {erro}"
                  )
                  dados = {}

          status = dados.get("status", "DESCONHECIDO")

          print("=" * 60)
          print("STATUS DO ORGANIZADOR:", status)
          print("AVISOS:", dados.get("total_avisos", 0))
          print("ERROS:", dados.get("total_erros", 0))
          print("OPERACOES ATIVAS:", dados.get("operacoes_ativas"))
          print("FALHAS DE VALIDACAO:", len(falhas))

          for falha in falhas:
              print("[VALIDACAO]", falha)

          print("=" * 60)

          if falhas:
              raise SystemExit(
                  "Um ou mais bancos nao passaram na validacao."
              )

          if status not in (
              "SUCESSO",
              "CONCLUIDO_COM_AVISOS",
              "CONCLUIDO_COM_ERROS",
          ):
              raise SystemExit(
                  f"Status final desconhecido: {status}"
              )

          print("VALIDACAO DOS SEIS BANCOS CONCLUIDA.")
          PY

      - name: Salvar bancos e relatorio
        if: always()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            data/graficos.db.gz \
            data/sinais.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/estatisticas_m5.db.gz \
            data/resultados_operacoes.db.gz \
            data/relatorio_organizador_xauusd.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos bancos ou relatorio."
          else
            git commit -m "Organizador XAUUSD: bancos e relatorio"
            git push origin HEAD:main
          fi

      - name: Guardar resultado da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organizador-xauusd-relatorio
          path: |
            data/relatorio_organizador_xauusd.json
            data/coletor_saida/manifesto_coletor.json
            data/graficos.db.gz
            data/sinais.db.gz
            data/memoria.db.gz
            data/operacoes.db.gz
            data/estatisticas_m5.db.gz
            data/resultados_operacoes.db.gz
          if-no-files-found: warn
          retention-days: 30
