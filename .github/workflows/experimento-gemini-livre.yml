name: Experimento Gemini Livre XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: experimento-gemini-livre-xau
  cancel-in-progress: false

jobs:
  experimento:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Localizar modelo Gemini
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma selecao Gemini encontrada."
            exit 1
          fi

          mkdir -p data

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name selecao-modelo-gemini \
            --dir data

          test -f data/modelo_gemini.json

      - name: Receber candles M5
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Integracao XAUUSD Bot V2" \
            --branch "$UPSTREAM_BRANCH" \
            --status success \
            --limit 100 \
            --json databaseId,headBranch,createdAt \
            --jq "map(select(
              .headBranch == \"$UPSTREAM_BRANCH\" and
              .createdAt <= \"$UPSTREAM_CREATED_AT\"
            )) | sort_by(.createdAt) | last | .databaseId // empty")

          if [ -z "$RUN_ID" ]; then
            echo "::error::Integracao anterior nao encontrada."
            exit 1
          fi

          mkdir -p data/candles

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name candles-xauusd-m5 \
            --dir data/candles

          test -f data/candles/xauusd_m5_fechados.csv

      - name: Recuperar historico do experimento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p data/anterior

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Experimento Gemini Livre XAUUSD" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name experimento-gemini-livre \
              --dir data/anterior || true
          else
            echo "Primeira execucao do experimento."
          fi

      - name: Executar Gemini Livre
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agente_gemini_livre.py

      - name: Salvar historico e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimento-gemini-livre
          path: data/experimento/
          if-no-files-found: warn
          retention-days: 90
