
name: Acompanhamento Autônomo XAUUSD

on:
  workflow_run:
    workflows:
      - "Central Inteligente XAUUSD"
    types:
      - completed

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: acompanhamento-autonomo-xau
  cancel-in-progress: false

jobs:
  acompanhar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Executar acompanhamento autônomo
        env:
          TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN: ${{ secrets.TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python acompanhamento_autonomo_xau.py

      - name: Executar agente operacional Gemini
        env:
          TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN: ${{ secrets.TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python integrar_agente_operacional_xau.py

      - name: Salvar estado, contexto e decisões
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/acompanhamento_autonomo_estado.json
          git add -f data/resultados_operacoes.json

          git add -f data/contexto_inteligente_acompanhador.json 2>/dev/null || true
          git add -f data/pacote_agente_operacional.json 2>/dev/null || true
          git add -f data/decisao_agente_operacional.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza acompanhamento e agente operacional XAUUSD"
            git push
          fi
