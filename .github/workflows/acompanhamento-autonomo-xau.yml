name: Acompanhamento Autônomo XAUUSD

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: acompanhamento-autonomo-xau
  cancel-in-progress: false

jobs:
  acompanhar:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Executar acompanhamento
        env:
          TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN: ${{ secrets.TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python acompanhamento_autonomo_xau.py

      - name: Salvar estado e histórico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/acompanhamento_autonomo_estado.json
          git add -f data/resultados_operacoes.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza acompanhamento autonomo XAUUSD"
            git push
          fi
