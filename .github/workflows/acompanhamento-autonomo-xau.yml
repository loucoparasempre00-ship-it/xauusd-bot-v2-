name: Acompanhamento Autônomo XAUUSD

on:
  workflow_run:
    workflows:
      - "Central Inteligente XAUUSD"
    types:
      - completed
      
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: acompanhamento-autonomo-xau
  cancel-in-progress: false

jobs:
  acompanhar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # CAMADA 1 — PREPARAR AMBIENTE
      - name: Preparar ambiente
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      # CAMADA 2 — TELEGRAM E IDENTIFICAÇÃO
      # O Python existente lê Telegram e verifica a operação.
      # Sem operação ativa, ele encerra sem buscar candles.
      - name: Ler Telegram e identificar operação
        env:
          TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN: ${{ secrets.TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python acompanhamento_autonomo_xau.py

      # CAMADA 3 — INTEGRAÇÃO
      # A integração de candles, indicadores e Central
      # é realizada pelo acompanhamento existente.
      # Não executar novamente o Gemini operacional.

      # CAMADA 4 — OPINIÃO E DECISÃO
      # Diretor operacional determinístico:
      # manter/subir stop e manter/fechar.
      # Nenhuma ordem é enviada à corretora.

      # CAMADA 5 — PERSISTÊNCIA
      - name: Salvar estado e histórico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/acompanhamento_autonomo_estado.json
          git add -f data/resultados_operacoes.json

          git add -f data/contexto_inteligente_acompanhador.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza acompanhamento operacional XAUUSD"
            git push
          fi
