name: Testar Modulos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Testar validador
        run: python -m unittest -v testar_validador.py

      - name: Testar estado
        run: python -m unittest -v testar_estado.py

      - name: Testar motor matematico
        run: python -m unittest -v testar_motor_matematico.py

      - name: Testar entradas
        run: python -m unittest -v testar_entradas.py
 
