
name: Coordenador XAUUSD

on:
  workflow_run:
    workflows:
      - "Agente Gemini XAUUSD"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordenador-xauusd
  cancel-in-progress: false

jobs:
  descobrir:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Procurar módulos Python que salvam arquivos
        shell: bash
        run: |
          python -u <<'PY'
          from pathlib import Path
          import ast

          ignorar = {
              ".git", ".venv", "venv", "env",
              "__pycache__", "node_modules"
          }

          palavras = (
              "save", "salvar", "write", "escrever",
              "dump", "export", "persist", "historico",
              "memoria", "resultado", "estado"
          )

          encontrados = 0

          print("=" * 60)
          print("COORDENADOR XAUUSD - DESCOBERTA DE MÓDULOS")
          print("=" * 60)

          for arquivo in sorted(Path(".").rglob("*.py")):
              if any(p in ignorar for p in arquivo.parts):
                  continue

              try:
                  codigo = arquivo.read_text(
                      encoding="utf-8", errors="replace"
                  )
                  arvore = ast.parse(codigo)
              except (OSError, SyntaxError) as erro:
                  print(f"\nERRO DE LEITURA: {arquivo} - {erro}")
                  continue

              achados = []

              for no in ast.walk(arvore):
                  if isinstance(no, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      nome = no.name.lower()
                      if any(p in nome for p in palavras):
                          achados.append(
                              f"função {no.name} (linha {no.lineno})"
                          )

                  if isinstance(no, ast.Call):
                      funcao = no.func
                      nome = ""

                      if isinstance(funcao, ast.Name):
                          nome = funcao.id.lower()
                      elif isinstance(funcao, ast.Attribute):
                          nome = funcao.attr.lower()

                      if nome in {
                          "write_text", "write_bytes", "to_csv",
                          "to_json", "dump", "save", "savefig",
                          "commit", "replace"
                      }:
                          achados.append(
                              f"gravação {nome} (linha {no.lineno})"
                          )

              if achados:
                  encontrados += 1
                  print(f"\nMÓDULO: {arquivo}")
                  for achado in sorted(set(achados)):
                      print(f"  - {achado}")

          print("\n" + "=" * 60)
          print(f"MÓDULOS COM INDÍCIOS DE GRAVAÇÃO: {encontrados}")
          print("Nenhum módulo do projeto foi executado.")
          print("Nenhum arquivo de memória foi alterado.")
          print("=" * 60)
          PY
