name: Coordenador XAUUSD

on:
  workflow_run:
    workflows:
      - "Agente Gemini XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coordenador-xauusd
  cancel-in-progress: false

jobs:
  coordenar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivos necessários
        shell: bash
        run: |
          set -e

          echo "Verificando memória e histórico de velas..."

          test -s data/memoria_agente.json || {
            echo "ERRO: memória de sinais não encontrada."
            exit 1
          }

          test -s data/historico_velas_m5.csv || {
            echo "ERRO: histórico de velas não encontrado."
            exit 1
          }

          echo "Memória encontrada."
          echo "Histórico de velas encontrado."
          echo "Arquivos prontos."

      - name: Acompanhar sinais e resultados
        run: |
          python -u acompanhar_operacoes_xau.py

      - name: Atualizar memória persistente
        run: |
          python -u memoria_persistente_gemini.py

      - name: Conferir arquivos atualizados
        shell: bash
        run: |
          set -e

          test -s data/resultados_operacoes.csv
          test -s data/memoria_agente.csv

          echo "Resultados e memória atualizados."

      - name: Salvar histórico para próxima execução
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/memoria_agente.json
          git add data/memoria_agente.csv
          git add data/resultados_operacoes.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para salvar."
          else
            git commit -m "Atualiza memoria e resultados XAUUSD"
            git push origin HEAD:main
          fi
