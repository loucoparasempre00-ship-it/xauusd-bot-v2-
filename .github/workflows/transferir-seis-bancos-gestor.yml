name: Transferir 6 Bancos para Gestor XAUUSD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transferencia-seis-bancos-gestor
  cancel-in-progress: false

jobs:
  transferir:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar Central
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar os seis bancos oficiais
        run: |
          set -euo pipefail
          for banco in \
            data/graficos.db.gz \
            data/estatisticas_m5.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/resultados_operacoes.db.gz \
            data/sinais.db.gz
          do
            test -s "$banco"
            gzip -t "$banco"
            echo "Validado: $banco"
          done

      - name: Transferir somente registros ainda não confirmados
        env:
          GESTOR_XAUUSD_URL: ${{ secrets.GESTOR_XAUUSD_URL }}
          GESTOR_XAUUSD_TOKEN: ${{ secrets.GESTOR_XAUUSD_TOKEN }}
        run: python fila_progressiva_gestor.py transferir

      - name: Persistir checkpoint mesmo se a transferência falhar
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/gestor_checkpoint.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gestor_checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "Persistir checkpoint da transferência incremental"
              git push origin HEAD:main
            else
              echo "Checkpoint sem alterações."
            fi
          else
            echo "Checkpoint ainda não foi criado."
          fi
