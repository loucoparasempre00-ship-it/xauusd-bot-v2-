name: Transferir 6 Bancos para Gestor XAUUSD

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Central Inteligente XAUUSD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: transferencia-seis-bancos-gestor
  cancel-in-progress: false

jobs:
  transferir:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar Central
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Criar e validar ZIP dos seis bancos oficiais
        run: |
          set -euo pipefail
          mkdir -p pacote
          for banco in \
            data/graficos.db.gz \
            data/estatisticas_m5.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/resultados_operacoes.db.gz \
            data/sinais.db.gz
          do
            test -s "$banco"
            cp "$banco" pacote/
          done

          cd pacote
          zip -0 -q ../bancos-xauusd.zip *.db.gz
          cd ..

          test -s bancos-xauusd.zip
          test "$(stat -c%s bancos-xauusd.zip)" -le $((80 * 1024 * 1024))
          unzip -t bancos-xauusd.zip

          ESPERADO="$(printf '%s\\n' \
            estatisticas_m5.db.gz \
            graficos.db.gz \
            memoria.db.gz \
            operacoes.db.gz \
            resultados_operacoes.db.gz \
            sinais.db.gz | sort)"
          RECEBIDO="$(unzip -Z1 bancos-xauusd.zip | sort)"

          if [ "$RECEBIDO" != "$ESPERADO" ]; then
            echo "O ZIP nao contem exatamente os seis bancos oficiais."
            printf 'Esperado:\\n%s\\nRecebido:\\n%s\\n' "$ESPERADO" "$RECEBIDO"
            exit 1
          fi

          sha256sum bancos-xauusd.zip
          echo "ZIP validado: exatamente seis bancos oficiais."

      - name: Enviar ZIP ao Worker do Gestor
        env:
          GESTOR_XAUUSD_BANCOS_URL: ${{ secrets.GESTOR_XAUUSD_BANCOS_URL }}
          GESTOR_XAUUSD_TOKEN: ${{ secrets.GESTOR_XAUUSD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GESTOR_XAUUSD_BANCOS_URL"
          test -n "$GESTOR_XAUUSD_TOKEN"

          URL="$GESTOR_XAUUSD_BANCOS_URL"
          case "$URL" in
            */central/bancos) ;;
            */) URL="${URL}central/bancos" ;;
            *) URL="${URL}/central/bancos" ;;
          esac

          echo "Enviando pacote ZIP ao Worker do Gestor."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Central-Secret: $GESTOR_XAUUSD_TOKEN" \
            --header "Content-Type: application/zip" \
            --data-binary @bancos-xauusd.zip \
            "$URL"

          echo
          echo "Worker recebeu o pacote. O workflow do Gestor concluirá a gravação em backups/bancos-xauusd.zip."
