name: Transferir 6 Bancos para Gestor XAUUSD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transferencia-seis-bancos-gestor
  cancel-in-progress: false

jobs:
  transferir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar Central
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar fila e enviar somente se houver bancos novos
        env:
          GESTOR_GITHUB_TOKEN: ${{ secrets.GESTOR_GITHUB_TOKEN }}
        run: python fila_progressiva_gestor.py transferir

      - name: Persistir registro do ultimo arquivo enviado
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/gestor_checkpoint.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gestor_checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "Registrar ultimo pacote enviado ao Gestor"
              git push origin HEAD:main
            else
              echo "Registro sem alteracoes."
            fi
          else
            echo "Nenhum checkpoint foi criado."
          fi
