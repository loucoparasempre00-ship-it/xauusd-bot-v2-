
name: Transferir 6 Bancos para Gestor XAUUSD

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Central Inteligente XAUUSD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: transferencia-seis-bancos-gestor
  cancel-in-progress: false

jobs:
  transferir:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar Central
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Criar e validar ZIP dos seis bancos
        run: |
          set -euo pipefail
          mkdir -p pacote

          for banco in \
            data/graficos.db.gz \
            data/estatisticas_m5.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/resultados_operacoes.db.gz \
            data/sinais.db.gz
          do
            test -s "$banco"
            cp "$banco" pacote/
          done

          cd pacote
          zip -0 -q ../bancos-xauusd.zip *.db.gz
          cd ..

          test -s bancos-xauusd.zip
          test "$(stat -c%s bancos-xauusd.zip)" -le $((80 * 1024 * 1024))
          unzip -t bancos-xauusd.zip

          ESPERADO="$(printf '%s\n' \
            estatisticas_m5.db.gz \
            graficos.db.gz \
            memoria.db.gz \
            operacoes.db.gz \
            resultados_operacoes.db.gz \
            sinais.db.gz | sort)"

          RECEBIDO="$(unzip -Z1 bancos-xauusd.zip | sort)"

          if [ "$RECEBIDO" != "$ESPERADO" ]; then
            echo "O ZIP nao contem exatamente os seis bancos."
            exit 1
          fi

          sha256sum bancos-xauusd.zip
          echo "Os seis bancos foram validados."

      - name: Enviar ZIP diretamente ao GitHub do Gestor
        env:
          GH_TOKEN: ${{ secrets.GESTOR_GITHUB_TOKEN }}
          GESTOR_REPO: loucoparasempre00-ship-it/gestor-xauusd
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          TAG="bancos-xauusd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" bancos-xauusd.zip \
            --repo "$GESTOR_REPO" \
            --title "Transferencia dos seis bancos XAUUSD" \
            --notes "Pacote enviado diretamente pela Central XAUUSD." \
            --target main

          echo "Pacote publicado no repositorio Gestor."
          echo "Tag: $TAG"
