name: Transferir 6 Bancos para Gestor XAUUSD

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Central Inteligente XAUUSD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: transferencia-seis-bancos-gestor
  cancel-in-progress: false

jobs:
  transferir:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar Central
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Criar e validar ZIP dos seis bancos oficiais
        run: |
          set -euo pipefail
          mkdir -p pacote
          for banco in \
            data/graficos.db.gz \
            data/estatisticas_m5.db.gz \
            data/memoria.db.gz \
            data/operacoes.db.gz \
            data/resultados_operacoes.db.gz \
            data/sinais.db.gz
          do
            test -s "$banco"
            cp "$banco" pacote/
          done
          cd pacote
          zip -0 -q ../bancos-xauusd.zip *.db.gz
          cd ..
          unzip -t bancos-xauusd.zip
          test "$(unzip -Z1 bancos-xauusd.zip | wc -l)" -eq 6
          sha256sum bancos-xauusd.zip

      - name: Acessar repositório Gestor
        uses: actions/checkout@v4
        with:
          repository: loucoparasempre00-ship-it/gestor-xauusd
          ref: main
          token: ${{ secrets.GESTOR_XAUUSD_TOKEN }}
          path: destino
          persist-credentials: true

      - name: Gravar ZIP no repositório Gestor
        run: |
          set -euo pipefail
          mkdir -p destino/backups
          cp bancos-xauusd.zip destino/backups/bancos-xauusd.zip
          cd destino
          git config user.name "Central XAUUSD"
          git config user.email "actions@users.noreply.github.com"
          git add backups/bancos-xauusd.zip
          if git diff --cached --quiet; then
            echo "O ZIP já está atualizado no Gestor."
            exit 0
          fi
          git commit -m "Transferir pacote ZIP dos seis bancos oficiais da Central"
          git push origin HEAD:main

      - name: Confirmar transferência
        run: |
          set -euo pipefail
          test -s destino/backups/bancos-xauusd.zip
          unzip -t destino/backups/bancos-xauusd.zip
          test "$(unzip -Z1 destino/backups/bancos-xauusd.zip | wc -l)" -eq 6
          echo "TRANSFERENCIA VALIDADA: seis bancos dentro do ZIP no Gestor."
