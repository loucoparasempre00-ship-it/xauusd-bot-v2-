
name: Analise Tecnica Contexto

on:
  workflow_run:
    workflows:
      - "Integracao XAUUSD Bot V2"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  analise:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar candles do Integrador
        uses: actions/download-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Conferir arquivo de candles
        run: |
          if [ ! -f data/xauusd_m5_fechados.csv ]; then
            echo "::error::O CSV de candles fechados nao foi encontrado."
            exit 1
          fi
          echo "Arquivo recebido corretamente."
          wc -l data/xauusd_m5_fechados.csv

      - name: Executar motor de contexto
        run: python -u motor_contexto_xau.py

      - name: Diagnosticar arquivos de analise
        run: |
          echo "=== DIRETORIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS PYTHON DO REPOSITORIO ==="
          find . -type f -name "*.py" -not -path "./.git/*"
          echo "=== FIM DO DIAGNOSTICO ==="

      - name: Disponibilizar analise para o agente
        uses: actions/upload-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data/analise_tecnica_contexto.json
          if-no-files-found: error
          retention-days: 2
