
name: Analise Tecnica Contexto

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Integrador"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  analise:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar candles do Integrador
        uses: actions/download-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Executar analise tecnica
        run: python -u analise_tecnica_contexto.py
