
name: Analise Tecnica Contexto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: read
  actions: read

jobs:
  analise:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivo de candles
        run: |
          if [ ! -f data/xauusd_m5_fechados.csv ]; then
            echo "ERRO: arquivo de candles fechados nao encontrado."
            echo "Este workflow precisa receber o CSV do Integrador."
            exit 1
          fi

          echo "Arquivo de candles encontrado."
          wc -l data/xauusd_m5_fechados.csv
