name: Acompanhar Operacoes XAUUSD

on:
  workflow_run:
    workflows:
      - "Agente Gemini XAUUSD"
    types:
      - completed

  schedule:
    - cron: "*/5 * * * 1-5"

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: acompanhar-operacoes-xau
  cancel-in-progress: false

jobs:
  acompanhar:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acompanhar sinais e registrar resultados
        run: python -u acompanhar_operacoes_xau.py

      - name: Salvar resultados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/resultados_operacoes.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultados das operacoes XAUUSD"
            git push
          else
            echo "Nenhuma alteracao nos resultados."
          fi
