name: Consulta sob demanda do banco oficial para o Gestor

on:
  repository_dispatch:
    types:
      - telegram_mensagem_gemini

permissions:
  contents: read

concurrency:
  group: gestor-consulta-${{ github.event.client_payload.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  receber:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código do Gestor
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validar mensagem recebida
        env:
          GESTOR_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          GESTOR_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          GESTOR_TEXTO: ${{ github.event.client_payload.texto }}
        run: |
          set -euo pipefail
          test -n "$GESTOR_REQUEST_ID"
          test -n "$GESTOR_CHAT_ID"
          test -n "$GESTOR_TEXTO"
          echo "Solicitação recebida pelo GitHub Actions."
          echo "Identificador: $GESTOR_REQUEST_ID"
          echo "Mensagem recebida; conteúdo omitido do log por privacidade."

      - name: Responder diretamente pelo GitHub Actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GESTOR_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          GESTOR_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          GESTOR_REPLY_TEXT: "Recebi sua mensagem. O GitHub Actions recebeu a solicitação e está pronto para executar a consulta do Gestor."
        run: |
          set -euo pipefail
          python gestor/telegram.py
