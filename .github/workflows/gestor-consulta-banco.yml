name: Consulta sob demanda do banco oficial para o Gestor

on:
  repository_dispatch:
    types:
      - telegram_mensagem_gemini

permissions:
  contents: read

concurrency:
  group: gestor-consulta-${{ github.event.client_payload.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout somente para leitura
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Consultar banco oficial em modo somente leitura
        id: consulta
        env:
          GESTOR_REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -euo pipefail
          test -n "$GESTOR_REQUEST_ID"
          python gestor/consulta_central.py

      - name: Devolver resultado autenticado ao Worker
        if: always()
        env:
          GESTOR_CALLBACK_SECRET: ${{ secrets.GESTOR_CALLBACK_SECRET }}
          GESTOR_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          CONSULTA_SUCESSO: ${{ steps.consulta.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -n "$GESTOR_CALLBACK_SECRET"
          test -n "$GESTOR_REQUEST_ID"
          python - <<'PY'
          import json, os, urllib.request
          sucesso = os.environ.get("CONSULTA_SUCESSO") == "true"
          contexto = None
          if sucesso:
              with open("gestor_contexto.json", encoding="utf-8") as f:
                  contexto = json.load(f)
          payload = json.dumps({
              "request_id": os.environ["GESTOR_REQUEST_ID"],
              "sucesso": sucesso,
              "contexto": contexto
          }).encode()
          req = urllib.request.Request(
              "https://gestor-xauusd.loucoparasempre00.workers.dev/gestor/resultado",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "X-Gestor-Callback-Secret": os.environ["GESTOR_CALLBACK_SECRET"]
              },
              method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              if not 200 <= response.status < 300:
                  raise RuntimeError("Callback recusado: HTTP " + str(response.status))
          print("Retorno enviado ao Worker; consulta_sucesso =", sucesso)
          PY
