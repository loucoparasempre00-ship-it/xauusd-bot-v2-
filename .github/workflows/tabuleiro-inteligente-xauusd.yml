
name: Tabuleiro Inteligente XAUUSD M5

on:
  workflow_run:
    workflows:
      - "Coordenador XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tabuleiro-inteligente-xauusd
  cancel-in-progress: false

jobs:
  processamento:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: 1 - Baixar repositório e histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2 - Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3 - Localizar integração de velas
        id: integracao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[]
              | select(.name == "Integracao XAUUSD Bot V2")
              | select(.conclusion == "success")]
              | sort_by(.created_at)
              | last
              | .id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "Nenhuma integração bem-sucedida encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Integração encontrada: $RUN_ID"

      - name: 4 - Baixar velas fechadas da integração
        uses: actions/download-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data
          repository: ${{ github.repository }}
          run-id: ${{ steps.integracao.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 5 - Verificar histórico de velas
        run: |
          mkdir -p data

          if [ ! -s data/xauusd_m5_fechados.csv ]; then
            echo "CSV de velas fechadas não encontrado."
            find data -maxdepth 2 -type f
            exit 1
          fi

          echo "Velas recebidas:"
          wc -l data/xauusd_m5_fechados.csv

          echo "Histórico anterior do tabuleiro:"
          if [ -f data/tabuleiro_m5.csv ]; then
            wc -l data/tabuleiro_m5.csv
          else
            echo "Primeira execução: histórico será iniciado."
          fi

      - name: 6 - Instalar dependências
        run: |
          python -m pip install --upgrade pip

      - name: 7 - Construir histórico do tabuleiro
        run: |
          python -u coletor_tabuleiro_m5.py

      - name: 8 - Detectar bordas e eventos
        run: |
          python -u detector_bordas_m5.py

      - name: 9 - Atualizar banco de dados
        run: |
          python -u banco_dados_tabuleiro.py

      - name: 10 - Processar estatísticas das regiões
        run: |
          python -u processador_estatistico_m5.py

      - name: 11 - Calcular sequências prováveis
        run: |
          python -u sequenciador_tabuleiro_m5.py

      - name: 12 - Avaliar resultados dos eventos
        run: |
          python -u avaliador_resultados_m5.py

      - name: 13 - Gerar relatório consolidado
        run: |
          python -u relatorio_tabuleiro_m5.py

      - name: 14 - Conferir arquivos produzidos
        run: |
          echo "========== TABULEIRO INTELIGENTE =========="

          for arquivo in \
            data/tabuleiro_m5.csv \
            data/eventos_bordas_m5.csv \
            data/tabuleiro_m5.db \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_resultados_m5.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv
          do
            if [ -f "$arquivo" ]; then
              echo "OK: $arquivo"
            else
              echo "AUSENTE: $arquivo"
              exit 1
            fi
          done

      - name: 15 - Salvar histórico e resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tabuleiro_m5.csv
          git add data/tabuleiro_m5.db
          git add data/eventos_bordas_m5.csv
          git add data/estatisticas_regioes_m5.csv
          git add data/transicoes_probabilidade_m5.csv
          git add data/sequencias_provaveis_m5.csv
          git add data/proximas_regioes_m5.json
          git add data/resultados_eventos_m5.csv
          git add data/resumo_resultados_m5.csv
          git add data/relatorio_tabuleiro_m5.json
          git add data/relatorio_geral_tabuleiro_m5.csv

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico e inteligência do tabuleiro M5"
            git push
          else
            echo "Nenhuma alteração para salvar."
          fi

      - name: 16 - Publicar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-tabuleiro-inteligente-m5
          path: |
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
            data/proximas_regioes_m5.json
            data/resumo_resultados_m5.csv
          if-no-files-found: warn
          retention-days: 30
