name: Limpar fila antiga XAUUSD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limpeza-fila-sinais-xauusd
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Limpar classificacoes e ranking antigos
        run: |
          set -e
          python - <<'PY'
          import gzip
          import os
          import shutil
          import sqlite3
          import tempfile

          caminho = "data/sinais.db.gz"
          alvos = ("RANKING_MELHORES", "CLASSIFICACAO_GEMINI")

          if not os.path.isfile(caminho):
              raise SystemExit("Banco data/sinais.db.gz nao encontrado.")

          with tempfile.TemporaryDirectory() as pasta:
              banco = os.path.join(pasta, "sinais.db")

              with gzip.open(caminho, "rb") as origem:
                  with open(banco, "wb") as destino:
                      shutil.copyfileobj(origem, destino)

              con = sqlite3.connect(banco)
              con.execute("PRAGMA foreign_keys = ON")

              tabelas = {
                  linha[0] for linha in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

              faltando = set(alvos) - tabelas
              if faltando:
                  con.close()
                  raise SystemExit(
                      "Tabelas obrigatorias ausentes; nada foi apagado: "
                      + ", ".join(sorted(faltando))
                  )

              # Impede apagar dados que sejam referenciados por outras tabelas.
              referencias_externas = []
              for tabela in tabelas:
                  nome_sql = '"' + tabela.replace('"', '""') + '"'
                  for fk in con.execute(
                      f"PRAGMA foreign_key_list({nome_sql})"
                  ):
                      tabela_referenciada = fk[2]
                      if tabela_referenciada in alvos and tabela not in alvos:
                          referencias_externas.append(
                              f"{tabela} -> {tabela_referenciada}"
                          )

              if referencias_externas:
                  con.close()
                  raise SystemExit(
                      "Limpeza interrompida: existem referencias externas: "
                      + "; ".join(referencias_externas)
                  )

              antes = {
                  tabela: con.execute(
                      f'SELECT COUNT(*) FROM "{tabela}"'
                  ).fetchone()[0]
                  for tabela in alvos
              }

              preservadas = {
                  tabela: con.execute(
                      'SELECT COUNT(*) FROM "' + tabela.replace('"', '""') + '"'
                  ).fetchone()[0]
                  for tabela in tabelas
                  if tabela not in alvos
              }

              con.execute("BEGIN IMMEDIATE")
              con.execute('DELETE FROM "RANKING_MELHORES"')
              con.execute('DELETE FROM "CLASSIFICACAO_GEMINI"')

              restantes = {
                  tabela: con.execute(
                      f'SELECT COUNT(*) FROM "{tabela}"'
                  ).fetchone()[0]
                  for tabela in alvos
              }

              if any(restantes.values()):
                  con.rollback()
                  con.close()
                  raise SystemExit(
                      "As tabelas de classificacao/ranking nao ficaram vazias."
                  )

              for tabela, esperado in preservadas.items():
                  atual = con.execute(
                      'SELECT COUNT(*) FROM "' + tabela.replace('"', '""') + '"'
                  ).fetchone()[0]
                  if atual != esperado:
                      con.rollback()
                      con.close()
                      raise SystemExit(
                          f"Contagem alterada indevidamente na tabela {tabela}."
                      )

              violacoes = con.execute("PRAGMA foreign_key_check").fetchall()
              if violacoes:
                  con.rollback()
                  con.close()
                  raise SystemExit(
                      f"Falha de integridade referencial: {len(violacoes)} violacao(oes)."
                  )

              integridade = con.execute("PRAGMA integrity_check").fetchone()[0]
              if integridade != "ok":
                  con.rollback()
                  con.close()
                  raise SystemExit(f"Falha de integridade SQLite: {integridade}")

              con.commit()
              con.close()

              temporario = caminho + ".tmp"
              with open(banco, "rb") as origem:
                  with open(temporario, "wb") as bruto:
                      with gzip.GzipFile(fileobj=bruto, mode="wb", mtime=0) as destino:
                          shutil.copyfileobj(origem, destino)

              os.replace(temporario, caminho)

              print("LIMPEZA CONCLUIDA")
              for tabela in alvos:
                  print(f"Registros removidos de {tabela}:", antes[tabela])
                  print(f"Registros restantes em {tabela}:", restantes[tabela])
              print("Demais tabelas preservadas:", len(preservadas))
              print("Integridade referencial: ok")
              print("Integridade SQLite:", integridade)
          PY

      - name: Salvar somente o banco de sinais
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sinais.db.gz
          if git diff --cached --quiet; then
            echo "Nenhum registro pendente para remover."
            exit 0
          fi
          git commit -m "Limpeza de classificacoes e ranking antigos"
          git pull --rebase origin main
          git push origin HEAD:main
