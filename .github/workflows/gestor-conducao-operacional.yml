name: Condução Operacional XAUUSD

on:
  push:
    paths:
      - "gestor/controle_conducao.py"
      - "gestor/conduzir_operacao_gemini.py"
      - ".github/workflows/gestor-conducao-operacional.yml"
  repository_dispatch:
    types:
      - telegram_conducao_operacao
      - supabase_conducao_tick
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gestor-conducao-operacional
  cancel-in-progress: false

jobs:
  validar:
    name: Validar sintaxe dos módulos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar os módulos Python
        run: |
          set -euo pipefail
          python -m py_compile gestor/controle_conducao.py gestor/conduzir_operacao_gemini.py gestor/telegram.py

  conduzir:
    name: Conduzir operação confirmada
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório e bancos oficiais
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Processar comando recebido pelo Telegram
        id: comando
        if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram_conducao_operacao'
        env:
          GESTOR_TEXTO: ${{ github.event.client_payload.texto }}
          GESTOR_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          GESTOR_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.GESTOR_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python gestor/controle_conducao.py comando

      - name: Preparar contexto da operação ativa
        id: contexto
        if: github.event.action == 'supabase_conducao_tick' || github.event_name == 'workflow_dispatch' || steps.comando.outputs.ativa == 'true'
        run: |
          set -euo pipefail
          test -s data/xauusd.db
          python gestor/controle_conducao.py preparar

      - name: Gemini exclusivo de condução
        if: steps.contexto.outputs.ativa == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GESTOR_GEMINI_MODEL_CONDUCAO: gemini-3.1-flash-lite
        run: |
          set -euo pipefail
          python gestor/conduzir_operacao_gemini.py
          test -s gestor_conducao_resultado.json

      - name: Aplicar decisão ao estado da condução
        if: steps.contexto.outputs.ativa == 'true'
        run: |
          set -euo pipefail
          python gestor/controle_conducao.py aplicar

      - name: Enviar decisão ao Telegram
        if: steps.contexto.outputs.ativa == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GESTOR_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python gestor/controle_conducao.py notificar

      - name: Persistir estado da condução no GitHub
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/gestor_conducao_estado.json ]; then
            echo "Nenhum estado novo para persistir."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gestor_conducao_estado.json

          if git diff --cached --quiet; then
            echo "Estado sem alterações."
            exit 0
          fi

          git commit -m "Gestor XAUUSD: atualiza estado da condução"
          git pull --rebase origin main
          git push origin HEAD:main
