
name: Consultar estruturas dos bancos da Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar Central
        uses: actions/checkout@v4

      - name: Diagnóstico compacto dos bancos
        run: |
          python - <<'PY'
          import gzip
          import sqlite3
          import tempfile
          import os

          bancos = [
              ("graficos", "data/graficos.db.gz"),
              ("estatisticas_m5", "data/estatisticas_m5.db.gz")
          ]

          for nome, arquivo in bancos:
              print("\n========== BANCO:", nome, "==========")

              if not os.path.isfile(arquivo):
                  raise RuntimeError("Banco não encontrado: " + arquivo)

              temp = tempfile.NamedTemporaryFile(
                  suffix=".db", delete=False
              )
              caminho = temp.name
              temp.close()

              try:
                  with gzip.open(arquivo, "rb") as entrada:
                      with open(caminho, "wb") as saida:
                          while True:
                              bloco = entrada.read(1024 * 1024)
                              if not bloco:
                                  break
                              saida.write(bloco)

                  db = sqlite3.connect(
                      "file:" + caminho + "?mode=ro",
                      uri=True
                  )

                  tabelas = db.execute("""
                      SELECT name FROM sqlite_master
                      WHERE type='table'
                      AND name NOT LIKE 'sqlite_%'
                      ORDER BY name
                  """).fetchall()

                  for (tabela,) in tabelas:
                      seguro = '"' + tabela.replace('"', '""') + '"'
                      colunas = db.execute(
                          "PRAGMA table_info(" + seguro + ")"
                      ).fetchall()

                      total = db.execute(
                          "SELECT COUNT(*) FROM " + seguro
                      ).fetchone()[0]

                      pk = [
                          c[1] for c in sorted(
                              [c for c in colunas if c[5] > 0],
                              key=lambda x: x[5]
                          )
                      ]

                      print("\nTABELA:", tabela)
                      print("REGISTROS:", total)
                      print("CHAVE PRIMARIA:", pk or "SEM PK")

                      for c in colunas:
                          print(
                              "COLUNA:", c[1],
                              "| TIPO:", c[2],
                              "| PK:", c[5]
                          )

                  print("\nTOTAL DE TABELAS:", len(tabelas))
                  db.close()

              finally:
                  if os.path.exists(caminho):
                      os.remove(caminho)

          print("\nDIAGNOSTICO CONCLUIDO")
          print("MODO SOMENTE LEITURA")
          PY
