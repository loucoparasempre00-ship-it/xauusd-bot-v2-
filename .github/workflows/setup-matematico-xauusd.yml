
name: Setup Matematico XAUUSD

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Grafico XAUUSD
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: setup-matematico-xauusd
  cancel-in-progress: false

jobs:
  setup-matematico:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Calibracao, validacao e evento matematico
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivos e bancos oficiais
        run: |
          set -e
          test -f otimizador_parametros_setup.py
          test -f validador_setup.py
          test -f motor_setup_matematico.py
          test -f data/graficos.db.gz
          test -f data/sinais.db.gz

          python -m py_compile \
            otimizador_parametros_setup.py \
            validador_setup.py \
            motor_setup_matematico.py

      - name: Calibrar notas e gatilhos
        run: python otimizador_parametros_setup.py

      - name: Validar LONG e SHORT
        id: validacao
        run: python validador_setup.py

      - name: Executar motor matematico
        if: steps.validacao.outputs.motor == 'sim'
        run: python motor_setup_matematico.py

      - name: Informar ausencia de aprovacao
        if: steps.validacao.outputs.motor != 'sim'
        run: |
          echo "Nenhuma versao aprovada disponivel."
          echo "Motor nao emitiu evento."

      - name: Verificar integridade do banco
        run: |
          python - <<'PY'
          import gzip
          import sqlite3
          import tempfile
          import os

          with gzip.open("data/sinais.db.gz", "rb") as f:
              dados = f.read()

          fd, caminho = tempfile.mkstemp(suffix=".db")
          os.close(fd)

          try:
              with open(caminho, "wb") as f:
                  f.write(dados)

              con = sqlite3.connect(caminho)

              resultado = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

              if resultado != "ok":
                  raise SystemExit(resultado)

              for tabela in ("setup_parametros", "setup_decisoes"):
                  total = con.execute(
                      f'SELECT COUNT(*) FROM "{tabela}"'
                  ).fetchone()[0]
                  print(f"{tabela}: {total}")

              print("Integridade SQLite: OK")
              con.close()
          finally:
              os.remove(caminho)
          PY

      - name: Salvar banco oficial de sinais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sinais.db.gz

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
          else
            git commit -m \
              "Atualiza setup matematico XAUUSD"

            git push origin HEAD:main
          fi
