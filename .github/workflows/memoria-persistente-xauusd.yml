
name: Memoria Persistente XAUUSD

on:
  workflow_run:
    workflows:
      - "Gerador de Sinal XAUUSD"
    types:
      - completed

  workflow_dispatch:
    inputs:
      gerador_run_id:
        description: "ID da execucao do Gerador (opcional)"
        required: false
        type: string
      grafico_run_id:
        description: "ID da execucao do Grafico (opcional)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: memoria-persistente-xau
  cancel-in-progress: false

jobs:
  memoria:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ==================================================
      # 1. PREPARAR AMBIENTE
      # ==================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar diretorios
        run: |
          mkdir -p \
            data/entrada/gerador \
            data/entrada/grafico \
            data/anterior

      # ==================================================
      # 2. IDENTIFICAR ENTRADAS
      # ==================================================

      - name: Identificar execucoes
        id: execucoes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_GERADOR_RUN_ID: ${{ inputs.gerador_run_id }}
          INPUT_GRAFICO_RUN_ID: ${{ inputs.grafico_run_id }}
        run: |
          set -euo pipefail

          GERADOR_RUN_ID="$INPUT_GERADOR_RUN_ID"

          if [ -z "$GERADOR_RUN_ID" ]; then
            GERADOR_RUN_ID="$EVENTO_RUN_ID"
          fi

          if [ -z "$GERADOR_RUN_ID" ]; then
            GERADOR_RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow gerador-sinal-xau.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi

          if [ -z "$GERADOR_RUN_ID" ]; then
            echo "::error::Gerador nao encontrado."
            exit 1
          fi

          GERADOR_INICIO="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GERADOR_RUN_ID" \
            --jq '.run_started_at // .created_at')"

          GRAFICO_RUN_ID="$INPUT_GRAFICO_RUN_ID"

          if [ -z "$GRAFICO_RUN_ID" ]; then
            GRAFICO_RUN_ID="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/grafico.yml/runs?status=success&per_page=100" \
              | jq -r --arg inicio "$GERADOR_INICIO" '
                [
                  .workflow_runs[]
                  | select(
                      .name == "Grafico XAUUSD"
                      and .conclusion == "success"
                      and (.run_started_at // .created_at) <= $inicio
                    )
                ]
                | sort_by(.run_started_at // .created_at)
                | last
                | .id // empty
              ')"
          fi

          if [ -z "$GRAFICO_RUN_ID" ]; then
            echo "::error::Grafico bem-sucedido anterior ao Gerador nao encontrado."
            exit 1
          fi

          echo "gerador_run_id=$GERADOR_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "grafico_run_id=$GRAFICO_RUN_ID" >> "$GITHUB_OUTPUT"

          echo "Gerador: $GERADOR_RUN_ID"
          echo "Grafico: $GRAFICO_RUN_ID"

      # ==================================================
      # 3. RECEBER GERADOR
      # ==================================================

      - name: Receber resultado do Gerador
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.execucoes.outputs.gerador_run_id }}
        run: |
          set -euo pipefail

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name resultado-gerador-sinal-xau \
            --dir data/entrada/gerador

          test -s data/entrada/gerador/decisao_final.json

      # ==================================================
      # 4. RECEBER GRAFICO E CANDLES
      # ==================================================

      - name: Receber Grafico e candles
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.execucoes.outputs.grafico_run_id }}
        run: |
          set -euo pipefail

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name contexto-grafico-xau \
            --dir data/entrada/grafico

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name candles-xauusd-m5 \
            --dir data/entrada/grafico/candles

          CONTEXTO="$(find data/entrada/grafico \
            -name contexto_inteligente_acompanhador.json \
            -print -quit)"

          CANDLES="$(find data/entrada/grafico/candles \
            -name xauusd_m5_fechados.csv \
            -print -quit)"

          test -n "$CONTEXTO"
          test -n "$CANDLES"
          test -s "$CONTEXTO"
          test -s "$CANDLES"

          cp "$CONTEXTO" data/contexto_inteligente_acompanhador.json
          cp "$CANDLES" data/xauusd_m5_fechados.csv
          cp "$CANDLES" data/historico_velas_m5.csv

      # ==================================================
      # 5. RECUPERAR MEMORIA ANTERIOR
      # ==================================================

      - name: Recuperar memoria anterior
        env:
          GH_TOKEN: ${{ github.token }}
          ATUAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/memoria-persistente-xauusd.yml/runs?status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ($ATUAL_RUN_ID | tonumber))] | sort_by(.run_started_at) | reverse | .[0].id // empty")"

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name memoria-agente-xau \
              --dir data/anterior || true
          fi

      # ==================================================
      # 6. CONSTRUIR TABULEIRO ESTAVEL
      # ==================================================

      - name: Construir Tabuleiro de regioes fixas
        run: |
          set -euo pipefail

          test -s data/historico_velas_m5.csv

          python -u tabuleiro_estavel_m5.py

          test -s data/tabuleiro_estavel_m5.csv
          test -s data/regioes_estaveis_m5.csv
          test -s data/transicoes_estaveis_m5.csv
          test -s data/contexto_tabuleiro_m5.json

      - name: Preparar matriz compativel do Tabuleiro
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          from pathlib import Path

          origem = Path("data/tabuleiro_estavel_m5.csv")
          destino = Path("data/tabuleiro_m5.csv")

          with origem.open(
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as arquivo:
              leitor = csv.DictReader(arquivo)
              campos = list(leitor.fieldnames or [])
              registros = list(leitor)

          obrigatorios = [
              "timestamp",
              "eixo_x",
              "eixo_y",
              "open",
              "high",
              "low",
              "close",
              "atr",
              "largura_regiao",
              "amplitude",
              "corpo",
              "direcao",
          ]

          ausentes = [
              campo for campo in obrigatorios
              if campo not in campos
          ]

          if ausentes:
              raise SystemExit(
                  f"Colunas ausentes na matriz estavel: {ausentes}"
              )

          if not registros:
              raise SystemExit("Tabuleiro sem registros.")

          if "evento" not in campos:
              campos.append("evento")

          for registro in registros:
              registro["evento"] = "VISITA"

          with destino.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as arquivo:
              escritor = csv.DictWriter(
                  arquivo,
                  fieldnames=campos
              )
              escritor.writeheader()
              escritor.writerows(registros)

          print("Matriz preparada:", destino)
          print("Registros:", len(registros))
          print("Largura fixa: US$ 1,50")
          print("ATR altera largura: NAO")
          PY

          test -s data/tabuleiro_m5.csv

      # ==================================================
      # 7. PROCESSAR OS SETE MODULOS DO TABULEIRO
      # ==================================================

      - name: 1 - Preparar entrega do Tabuleiro
        run: |
          set -euo pipefail
          python -u banco_dados_tabuleiro.py

      - name: 2 - Detectar bordas
        run: |
          set -euo pipefail
          python -u detector_bordas_m5.py

      - name: 3 - Processar estatisticas
        run: |
          set -euo pipefail
          python -u processador_estatistico_m5.py

      - name: 4 - Identificar sequencias
        run: |
          set -euo pipefail
          python -u sequenciador_tabuleiro_m5.py

      - name: 5 - Avaliar resultados
        run: |
          set -euo pipefail
          python -u avaliador_resultados_m5.py

      - name: 6 - Gerar relatorio
        run: |
          set -euo pipefail
          python -u relatorio_tabuleiro_m5.py

      # O relatório já utilizou o nome original.
      # O nome de entrega abaixo permite ao Coletor
      # classificar este arquivo em estatisticas_m5.

      - name: Classificar resumo do Tabuleiro para entrega
        run: |
          set -euo pipefail

          test -s data/resumo_resultados_m5.csv

          mv \
            data/resumo_resultados_m5.csv \
            data/resumo_estatistico_m5_resultados.csv

      - name: 7 - Preparar contexto do Acompanhador
        run: |
          set -euo pipefail
          python -u preparar_contexto_acompanhador.py

      # ==================================================
      # 8. CONSOLIDAR MEMORIA E DECISOES
      # ==================================================

      - name: Consolidar memoria e decisoes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          data = Path("data")
          entrada = data / "entrada" / "gerador"
          agora = datetime.now(timezone.utc).isoformat()

          decisao = json.loads(
              (entrada / "decisao_final.json").read_text(encoding="utf-8")
          )

          contexto = json.loads(
              (data / "contexto_inteligente_acompanhador.json").read_text(encoding="utf-8")
          )

          candle = str(decisao.get("candle_utc", "")).strip()
          candle_grafico = str(contexto.get("candle_utc", "")).strip()
          lado = str(decisao.get("decisao_final", "")).upper()

          if not candle:
              raise SystemExit("Decisao sem candle_utc.")

          if candle_grafico and candle_grafico != candle:
              raise SystemExit("Candle do Gerador diferente do Grafico.")

          if lado not in ("COMPRA", "VENDA", "SEM_SINAL"):
              raise SystemExit("Decisao final invalida.")

          def ler(caminho):
              if not caminho.exists():
                  return []

              obj = json.loads(
                  caminho.read_text(encoding="utf-8")
              )

              if isinstance(obj, list):
                  return [
                      x for x in obj
                      if isinstance(x, dict)
                  ]

              if isinstance(obj, dict):
                  for chave in (
                      "historico",
                      "registros",
                      "sinais",
                      "decisoes"
                  ):
                      if isinstance(obj.get(chave), list):
                          return [
                              x for x in obj[chave]
                              if isinstance(x, dict)
                          ]

              raise SystemExit(
                  f"Memoria invalida: {caminho}"
              )

          historico = []
          indices = {}

          anteriores = [
              data / "anterior" / "memoria_agente.json",
              data / "memoria_agente.json",
          ]

          for caminho in anteriores:
              for item in ler(caminho):
                  c = str(item.get("candle_utc", "")).strip()
                  d = str(
                      item.get(
                          "decisao",
                          item.get("sinal", "")
                      )
                  ).upper().strip()

                  if not c:
                      historico.append(item)
                      continue

                  chave = (c, d)

                  if chave not in indices:
                      indices[chave] = len(historico)
                      historico.append(item)
                  else:
                      antigo = historico[indices[chave]]

                      for k, v in item.items():
                          if v not in (None, ""):
                              antigo[k] = v

          ia = decisao.get("avaliacao_gemini") or {}
          setup = decisao.get("setup_matematico") or {}

          registro = {
              "candle_utc": candle,
              "id_sinal": decisao.get("id_sinal"),
              "sinal": lado,
              "decisao": lado,
              "decisao_final": lado,
              "ativo": decisao.get("ativo", "XAUUSD"),
              "timeframe": decisao.get("timeframe", "M5"),
              "entrada": decisao.get("entrada"),
              "stop": decisao.get("stop_loss"),
              "stop_loss": decisao.get("stop_loss"),
              "gain": decisao.get("take_profit"),
              "take_profit": decisao.get("take_profit"),
              "confianca": ia.get("confianca"),
              "pontuacao_final": decisao.get("pontuacao_final"),
              "pontuacao_compra": decisao.get("pontuacao_compra"),
              "pontuacao_venda": decisao.get("pontuacao_venda"),
              "modelo_utilizado": ia.get("modelo_utilizado", ""),
              "justificativa": ia.get("justificativa", ""),
              "atr14": decisao.get("atr14"),
              "origem": "GERADOR_DE_SINAL_XAU",
              "resultado": "",
              "registrado_utc": agora,
          }

          chave = (candle, lado)

          if chave in indices:
              antigo = historico[indices[chave]]

              for k, v in registro.items():
                  if v not in (None, ""):
                      antigo[k] = v
          else:
              historico.append(registro)

          memoria = {
              "versao": 2,
              "atualizado_utc": agora,
              "total_registros": len(historico),
              "historico": historico,
          }

          (data / "memoria_agente.json").write_text(
              json.dumps(
                  memoria,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          caminho_decisoes = data / "historico_decisoes_xau.json"
          decisoes = ler(caminho_decisoes)

          item = {
              "candle_utc": candle,
              "id_sinal": decisao.get("id_sinal"),
              "decisao_final": lado,
              "pontuacao_final": decisao.get("pontuacao_final"),
              "pontuacao_compra": decisao.get("pontuacao_compra"),
              "pontuacao_venda": decisao.get("pontuacao_venda"),
              "entrada": decisao.get("entrada"),
              "stop_loss": decisao.get("stop_loss"),
              "take_profit": decisao.get("take_profit"),
              "atr14": decisao.get("atr14"),
              "avaliacao_gemini": ia,
              "setup_matematico": setup,
              "modelo_utilizado": ia.get("modelo_utilizado", ""),
              "registrado_utc": agora,
          }

          chave_decisao = (candle, lado)
          encontrado = False

          for i, antigo in enumerate(decisoes):
              if (
                  antigo.get("candle_utc"),
                  str(
                      antigo.get("decisao_final", "")
                  ).upper()
              ) == chave_decisao:
                  decisoes[i] = item
                  encontrado = True
                  break

          if not encontrado:
              decisoes.append(item)

          caminho_decisoes.write_text(
              json.dumps(
                  decisoes,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          print("Memoria preservada:", len(historico))
          print("Historico de decisoes:", len(decisoes))
          print("Decisao atual:", lado)
          PY

      # ==================================================
      # 9. ATUALIZAR MEMORIA CSV
      # ==================================================

      - name: Atualizar CSV da memoria
        run: |
          set -euo pipefail
          python -u memoria_persistente_gemini.py

      # ==================================================
      # 10. AVALIAR OPERACOES
      # ==================================================

      - name: Atualizar resultados das operacoes reais
        shell: bash
        run: |
          set -euo pipefail

          cp \
            data/memoria_agente.json \
            data/memoria_agente_completa.json

          python - <<'PY'
          import json
          from pathlib import Path

          caminho = Path("data/memoria_agente.json")
          dados = json.loads(
              caminho.read_text(encoding="utf-8")
          )

          historico = dados.get("historico", [])
          reais = []

          for item in historico:
              lado = str(
                  item.get(
                      "decisao_final",
                      item.get(
                          "decisao",
                          item.get("sinal", "")
                      )
                  )
              ).upper()

              if lado not in ("COMPRA", "VENDA"):
                  continue

              entrada = item.get("entrada")
              stop = item.get(
                  "stop_loss",
                  item.get("stop")
              )
              alvo = item.get(
                  "take_profit",
                  item.get("gain")
              )

              if (
                  entrada in (None, "")
                  or stop in (None, "")
                  or alvo in (None, "")
              ):
                  continue

              reais.append(item)

          caminho.write_text(
              json.dumps(
                  {"historico": reais},
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          print("Sinais reais avaliados:", len(reais))
          PY

          trap 'cp data/memoria_agente_completa.json data/memoria_agente.json' EXIT

          python -u acompanhar_operacoes_xau.py

          cp \
            data/memoria_agente_completa.json \
            data/memoria_agente.json

          rm data/memoria_agente_completa.json
          trap - EXIT

      # ==================================================
      # 11. RANKING E MARCADORES
      # ==================================================

      - name: Gerar ranking e marcadores do grafico
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          data = Path("data")
          caminho = data / "resultados_operacoes.csv"

          with caminho.open(
              encoding="utf-8-sig",
              newline=""
          ) as f:
              resultados = list(
                  csv.DictReader(f, delimiter=";")
              )

          reais = [
              x for x in resultados
              if x.get("tipo_avaliacao") == "REAL"
          ]

          def resumo(lista):
              alvos = sum(
                  x.get("status") == "ALVO"
                  for x in lista
              )

              stops = sum(
                  x.get("status") == "STOP"
                  for x in lista
              )

              ambiguos = sum(
                  x.get("status") == "AMBIGUO"
                  for x in lista
              )

              abertas = sum(
                  x.get("status") == "EM_ABERTO"
                  for x in lista
              )

              decididos = alvos + stops

              taxa = (
                  round(alvos / decididos * 100, 2)
                  if decididos else None
              )

              soma_r = 0.0

              for x in lista:
                  try:
                      soma_r += float(
                          str(
                              x.get("resultado_r", "")
                          ).replace(",", ".")
                      )
                  except (TypeError, ValueError):
                      pass

              return {
                  "total": len(lista),
                  "alvos": alvos,
                  "stops": stops,
                  "ambiguos": ambiguos,
                  "em_aberto": abertas,
                  "taxa_acerto_percentual": taxa,
                  "resultado_r_acumulado": round(soma_r, 2),
              }

          ranking = {
              "ativo": "XAUUSD",
              "atualizado_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "criterio": (
                  "Somente sinais reais avaliados "
                  "por candles M5 fechados."
              ),
              "geral": resumo(reais),
              "por_direcao": {
                  lado: resumo([
                      x for x in reais
                      if x.get("direcao") == lado
                  ])
                  for lado in ("COMPRA", "VENDA")
              },
          }

          (data / "ranking_sinais_xau.json").write_text(
              json.dumps(
                  ranking,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          marcadores = []

          for x in reais:
              marcadores.append({
                  "id_sinal": x.get("id_sinal", ""),
                  "candle_utc": x.get("horario_sinal_utc", ""),
                  "direcao": x.get("direcao", ""),
                  "entrada": x.get("entrada", ""),
                  "stop": x.get("stop", ""),
                  "alvo": x.get("alvo", ""),
                  "status": x.get("status", ""),
                  "resultado_r": x.get("resultado_r", ""),
              })

          (data / "marcadores_sinais_xau.json").write_text(
              json.dumps(
                  marcadores,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          contexto = json.loads(
              (data / "contexto_inteligente_acompanhador.json").read_text(
                  encoding="utf-8"
              )
          )

          decisao = json.loads(
              (data / "entrada/gerador/decisao_final.json").read_text(
                  encoding="utf-8"
              )
          )

          abertas = [
              x for x in reais
              if x.get("status") == "EM_ABERTO"
          ]

          pacote = {
              "ativo": "XAUUSD",
              "gerado_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "candle_utc": decisao.get("candle_utc"),
              "grafico": contexto,
              "decisao_atual": decisao,
              "operacoes_abertas": abertas,
              "ranking": ranking,
              "marcadores_sinais": marcadores,
              "tabuleiro": {
                  "contexto": "data/contexto_tabuleiro_m5.json",
                  "relatorio": "data/relatorio_tabuleiro_m5.json",
                  "proximas_regioes": "data/proximas_regioes_m5.json",
                  "estatisticas": "data/estatisticas_regioes_m5.csv",
                  "transicoes": "data/transicoes_probabilidade_m5.csv",
              },
              "arquivos_referencia": {
                  "memoria": "data/memoria_agente.json",
                  "historico_decisoes": "data/historico_decisoes_xau.json",
                  "resultados": "data/resultados_operacoes.csv",
                  "ranking": "data/ranking_sinais_xau.json",
                  "marcadores": "data/marcadores_sinais_xau.json",
                  "candles_m5": "data/historico_velas_m5.csv",
              },
              "execucao_ordens": False,
          }

          (data / "pacote_memoria_condutor.json").write_text(
              json.dumps(
                  pacote,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          print("Sinais reais:", len(reais))
          print("Operacoes abertas:", len(abertas))
          print("Ranking:", ranking["geral"])
          PY

      # ==================================================
      # 12. VALIDAR ENTRADAS E SAIDAS
      # ==================================================

      - name: Validar arquivos da memoria e Tabuleiro
        run: |
          set -euo pipefail

          arquivos=(
            data/memoria_agente.json
            data/memoria_agente.csv
            data/historico_decisoes_xau.json
            data/resultados_operacoes.csv
            data/ranking_sinais_xau.json
            data/marcadores_sinais_xau.json
            data/pacote_memoria_condutor.json

            data/historico_velas_m5.csv
            data/xauusd_m5_fechados.csv
            data/contexto_inteligente_acompanhador.json

            data/tabuleiro_m5.csv
            data/tabuleiro_estavel_m5.csv
            data/regioes_estaveis_m5.csv
            data/transicoes_estaveis_m5.csv
            data/contexto_tabuleiro_m5.json
            data/entrega_tabuleiro_m5.csv
            data/controle_tabuleiro_m5.json

            data/eventos_bordas_m5.csv
            data/estatisticas_regioes_m5.csv
            data/transicoes_probabilidade_m5.csv
            data/resumo_estatistico_m5.json
            data/sequencias_provaveis_m5.csv
            data/proximas_regioes_m5.json
            data/resultados_eventos_m5.csv
            data/resumo_estatistico_m5_resultados.csv
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
          )

          for arquivo in "${arquivos[@]}"; do
            test -s "$arquivo" || {
              echo "::error::Arquivo ausente: $arquivo"
              exit 1
            }
          done

          python - <<'PY'
          import json
          from pathlib import Path

          contexto = json.loads(
              Path("data/contexto_tabuleiro_m5.json").read_text(
                  encoding="utf-8"
              )
          )

          largura = (
              contexto.get("metodo", {})
              .get("largura_regiao")
          )

          if float(largura or 0) != 1.50:
              raise SystemExit(
                  "Largura do Tabuleiro diferente de US$ 1,50."
              )

          controle = json.loads(
              Path("data/controle_tabuleiro_m5.json").read_text(
                  encoding="utf-8"
              )
          )

          if controle.get("status") != "SUCESSO":
              raise SystemExit(
                  "Controle de entrega do Tabuleiro não aprovou."
              )

          print("Entradas e saídas validadas.")
          print("Tabuleiro fixo: US$ 1,50.")
          PY

      # ==================================================
      # 13. REGISTRAR MANIFESTO DE ENTRADA E SAIDA
      # ==================================================

      - name: Gerar manifesto da memoria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          data = Path("data")

          entradas = [
              "data/entrada/gerador/decisao_final.json",
              "data/xauusd_m5_fechados.csv",
              "data/historico_velas_m5.csv",
          ]

          saidas = [
              "data/memoria_agente.json",
              "data/memoria_agente.csv",
              "data/historico_decisoes_xau.json",
              "data/resultados_operacoes.csv",
              "data/ranking_sinais_xau.json",
              "data/marcadores_sinais_xau.json",
              "data/pacote_memoria_condutor.json",
              "data/contexto_inteligente_acompanhador.json",
              "data/contexto_tabuleiro_m5.json",
              "data/tabuleiro_m5.csv",
              "data/entrega_tabuleiro_m5.csv",
              "data/eventos_bordas_m5.csv",
              "data/estatisticas_regioes_m5.csv",
              "data/transicoes_probabilidade_m5.csv",
              "data/sequencias_provaveis_m5.csv",
              "data/proximas_regioes_m5.json",
              "data/resultados_eventos_m5.csv",
              "data/relatorio_tabuleiro_m5.json",
          ]

          manifesto = {
              "versao": 1,
              "modulo": "MEMORIA_PERSISTENTE_XAUUSD",
              "atualizado_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "status": "SUCESSO",
              "entrada": [
                  {
                      "arquivo": nome,
                      "disponivel": Path(nome).is_file(),
                  }
                  for nome in entradas
              ],
              "saida": [
                  {
                      "arquivo": nome,
                      "disponivel": Path(nome).is_file(),
                  }
                  for nome in saidas
              ],
              "destino_persistencia": (
                  "Coletor XAUUSD e Organizador XAUUSD"
              ),
              "gravacao_direta_bancos_oficiais": False,
              "execucao_ordens": False,
          }

          caminho = data / "manifesto_memoria_xau.json"

          caminho.write_text(
              json.dumps(
                  manifesto,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          print("Manifesto gerado:", caminho)
          PY

      # ==================================================
      # 14. SALVAR SAIDAS NO REPOSITORIO
      # ==================================================

      - name: Salvar memoria e Tabuleiro no repositorio
        if: success()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/memoria_agente.json \
            data/memoria_agente.csv \
            data/historico_decisoes_xau.json \
            data/resultados_operacoes.csv \
            data/ranking_sinais_xau.json \
            data/marcadores_sinais_xau.json \
            data/pacote_memoria_condutor.json \
            data/manifesto_memoria_xau.json \
            data/historico_velas_m5.csv \
            data/xauusd_m5_fechados.csv \
            data/contexto_inteligente_acompanhador.json \
            data/tabuleiro_m5.csv \
            data/tabuleiro_estavel_m5.csv \
            data/regioes_estaveis_m5.csv \
            data/transicoes_estaveis_m5.csv \
            data/contexto_tabuleiro_m5.json \
            data/entrega_tabuleiro_m5.csv \
            data/controle_tabuleiro_m5.json \
            data/eventos_bordas_m5.csv \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/resumo_estatistico_m5.json \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_estatistico_m5_resultados.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv

          if ! git diff --cached --quiet; then
            git commit -m "Memoria XAUUSD: entradas, saidas e Tabuleiro M5"
            git push origin HEAD:main
          else
            echo "Nenhuma alteracao nova."
          fi

      # ==================================================
      # 15. PUBLICAR SAIDA PARA O CONDUTOR
      # ==================================================

      - name: Publicar memoria e Tabuleiro para o Condutor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memoria-xauusd-condutor
