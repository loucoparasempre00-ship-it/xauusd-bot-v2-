
name: Central Inteligente XAUUSD

on:
  workflow_run:
    workflows:
      - "Memoria Persistente XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: central-inteligente-xauusd
  cancel-in-progress: false

jobs:
  central:
    name: Central + Coordenador
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'Memoria Persistente XAUUSD'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Preparar diretorio de dados
        run: mkdir -p data

      # ==========================================
      # 1. RECUPERAR MEMORIA PERSISTENTE
      # ==========================================

      - name: Identificar execucao da memoria
        id: memoria_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          RUN_EVENTO: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENTO" = "workflow_run" ]; then
            RUN_ID="$RUN_EVENTO"
          else
            RUN_ID="$(gh run list \
              --workflow 'Memoria Persistente XAUUSD' \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Execucao da memoria nao encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Baixar memoria persistente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/memoria-artifact
          gh run download "${{ steps.memoria_run.outputs.run_id }}" \
            --name memoria-agente-xau \
            --dir /tmp/memoria-artifact
          cp -a /tmp/memoria-artifact/. data/

      - name: Validar memoria
        run: test -s data/memoria_agente.json

      # ==========================================
      # 2. RECUPERAR INTEGRACAO M5
      # ==========================================

      - name: Identificar integracao M5
        id: integracao_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --workflow 'Integracao XAUUSD Bot V2' \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Integracao M5 nao encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Baixar candles M5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/candles-artifact
          gh run download "${{ steps.integracao_run.outputs.run_id }}" \
            --name candles-xauusd-m5 \
            --dir /tmp/candles-artifact
          cp -a /tmp/candles-artifact/. data/

      - name: Preparar historico M5
        shell: bash
        run: |
          set -euo pipefail

          if [ -s data/xauusd_m5_fechados.csv ]; then
            cp data/xauusd_m5_fechados.csv \
              data/historico_velas_m5.csv
          elif [ -s data/xauusd_m5.csv ]; then
            cp data/xauusd_m5.csv \
              data/historico_velas_m5.csv
          else
            echo "Historico M5 nao encontrado."
            exit 1
          fi

          test -s data/historico_velas_m5.csv

      # ==========================================
      # 3. COORDENADOR AUTONOMO
      # ==========================================

      - name: Executar Coordenador Autonomo
        env:
          TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN: ${{ secrets.TELEGRAM_ACOMPANHAMENTO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u acompanhamento_autonomo_xau.py

      # ==========================================
      # 4. ACOMPANHAMENTO E CONSOLIDACAO
      # ==========================================

      - name: Validar entradas
        run: |
          test -s data/memoria_agente.json
          test -s data/historico_velas_m5.csv

      - name: Atualizar resultados das operacoes
        run: python -u acompanhar_operacoes_xau.py

      - name: Atualizar memoria do Gemini
        run: python -u memoria_persistente_gemini.py

      # ==========================================
      # 5. TABULEIRO INTELIGENTE
      # ==========================================

      - name: Coletar tabuleiro M5
        run: python -u coletor_tabuleiro_m5.py

      - name: Detectar bordas M5
        run: python -u detector_bordas_m5.py

      - name: Atualizar banco de dados
        run: python -u banco_dados_tabuleiro.py

      - name: Processar estatisticas
        run: python -u processador_estatistico_m5.py

      - name: Sequenciar regioes provaveis
        run: python -u sequenciador_tabuleiro_m5.py

      - name: Avaliar resultados dos eventos
        run: python -u avaliador_resultados_m5.py

      - name: Gerar relatorio do tabuleiro
        run: python -u relatorio_tabuleiro_m5.py

      - name: Consolidar tabuleiro estavel
        run: python -u tabuleiro_estavel_m5.py

      # ==========================================
      # 6. VALIDAR CONSOLIDACAO
      # ==========================================

      - name: Validar arquivos produzidos
        shell: bash
        run: |
          set -euo pipefail

          required=(
            data/memoria_agente.json
            data/memoria_agente.csv
            data/resultados_operacoes.csv
            data/acompanhamento_autonomo_estado.json
            data/resultados_operacoes.json
            data/tabuleiro_m5.csv
            data/eventos_bordas_m5.csv
            data/tabuleiro_m5.db
            data/estatisticas_regioes_m5.csv
            data/transicoes_probabilidade_m5.csv
            data/sequencias_provaveis_m5.csv
            data/proximas_regioes_m5.json
            data/resultados_eventos_m5.csv
            data/resumo_resultados_m5.csv
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
            data/tabuleiro_estavel_m5.csv
            data/regioes_estaveis_m5.csv
            data/transicoes_estaveis_m5.csv
            data/contexto_tabuleiro_m5.json
          )

          missing=()

          for arquivo in "${required[@]}"; do
            if [ ! -s "$arquivo" ]; then
              echo "AUSENTE OU VAZIO: $arquivo"
              missing+=("$arquivo")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            exit 1
          fi

          echo "Consolidacao validada."

      # ==========================================
      # 7. PERSISTIR ESTADO E RESULTADOS
      # ==========================================

      - name: Salvar dados da Central
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza Central Inteligente XAUUSD"
            git push origin HEAD:main
          else
            echo "Nenhuma alteracao para salvar."
          fi

      # ==========================================
      # 8. PUBLICAR RELATORIO
      # ==========================================

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-central-inteligente-xauusd
          path: |
            data/contexto_tabuleiro_m5.json
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
            data/resultados_operacoes.csv
            data/acompanhamento_autonomo_estado.json
            data/resultados_operacoes.json
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # 9. TESTADOR GEMINI - LIMITE DE 24 HORAS
      # ==========================================

      - name: Verificar necessidade de teste Gemini
        id: teste_gemini
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path("data/historico_conexoes_gemini.json")
          executar = True

          if path.exists():
              try:
                  dados = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  valor = (
                      dados.get("ultima_verificacao")
                      or dados.get("timestamp_utc")
                  )

                  if valor:
                      instante = datetime.fromisoformat(
                          valor.replace("Z", "+00:00")
                      )

                      executar = (
                          datetime.now(timezone.utc) - instante
                          >= timedelta(hours=24)
                      )
              except Exception:
                  executar = True

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as arquivo:
              arquivo.write(
                  f"executar={'true' if executar else 'false'}\n"
              )
          PY

      - name: Acionar Testador Gemini
        if: steps.teste_gemini.outputs.executar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run testador-gemini.yml --ref main
