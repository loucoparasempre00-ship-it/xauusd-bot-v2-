
name: Central Inteligente XAUUSD

on:
  workflow_run:
    workflows:
      - "Memoria Persistente XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: central-inteligente-xauusd-${{ github.event.workflow_run.name || github.event_name }}
  cancel-in-progress: false

jobs:
  processamento:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.name == 'Memoria Persistente XAUUSD' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ==========================================
      # 1 - PREPARACAO
      # ==========================================

      - name: 1 - Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2 - Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3 - Preparar ambiente
        shell: bash
        run: |
          set -e
          mkdir -p data
          python --version
          echo "Ambiente preparado."

      # ==========================================
      # 2 - RECUPERAR MEMORIA DO GEMINI
      # ==========================================

      - name: 4 - Localizar execucao da memoria
        id: memoria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          RUN_EVENTO: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -e

          if [ "$EVENTO" = "workflow_run" ]; then
            RUN_ID="$RUN_EVENTO"
          else
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '[.workflow_runs[]
                | select(.name == "Memoria Persistente XAUUSD")
                | select(.conclusion == "success")]
                | sort_by(.created_at)
                | last
                | .id // empty')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERRO: nenhuma memoria bem-sucedida encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Execucao da memoria encontrada: $RUN_ID"

      - name: 5 - Baixar memoria persistente
        uses: actions/download-artifact@v4
        with:
          name: memoria-agente-xau
          path: data
          repository: ${{ github.repository }}
          run-id: ${{ steps.memoria.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 6 - Conferir memoria recebida
        shell: bash
        run: |
          set -e
          test -s data/memoria_agente.json
          echo "Memoria do Gemini recebida."

      # ==========================================
      # 3 - LOCALIZAR INTEGRACAO DE VELAS
      # ==========================================

      - name: 7 - Localizar integracao de velas
        id: integracao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[]
              | select(.name == "Integracao XAUUSD Bot V2")
              | select(.conclusion == "success")]
              | sort_by(.created_at)
              | last
              | .id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "ERRO: nenhuma integracao bem-sucedida encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Integracao encontrada: $RUN_ID"

      - name: 8 - Baixar velas fechadas
        uses: actions/download-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data
          repository: ${{ github.repository }}
          run-id: ${{ steps.integracao.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 9 - Preparar historico de velas
        shell: bash
        run: |
          set -e

          test -s data/xauusd_m5_fechados.csv

          cp data/xauusd_m5_fechados.csv \
             data/historico_velas_m5.csv

          test -s data/historico_velas_m5.csv

          echo "Historico de velas preparado."
          wc -l data/historico_velas_m5.csv

      # ==========================================
      # 4 - COORDENADOR
      # ==========================================

      - name: 10 - Verificar arquivos necessarios
        shell: bash
        run: |
          set -e

          test -s data/memoria_agente.json
          test -s data/historico_velas_m5.csv

          echo "Memoria e historico encontrados."

      - name: 11 - Acompanhar sinais e resultados
        run: python -u acompanhar_operacoes_xau.py

      - name: 12 - Atualizar memoria persistente
        run: python -u memoria_persistente_gemini.py

      - name: 13 - Conferir arquivos atualizados
        shell: bash
        run: |
          set -e

          test -s data/resultados_operacoes.csv
          test -s data/memoria_agente.csv

          echo "Memoria e resultados atualizados."

      # ==========================================
      # 5 - TABULEIRO INTELIGENTE
      # ==========================================

      - name: 14 - Construir historico do tabuleiro
        run: python -u coletor_tabuleiro_m5.py

      - name: 15 - Detectar bordas e eventos
        run: python -u detector_bordas_m5.py

      - name: 16 - Atualizar banco de dados
        run: python -u banco_dados_tabuleiro.py

      - name: 17 - Processar estatisticas das regioes
        run: python -u processador_estatistico_m5.py

      - name: 18 - Calcular sequencias provaveis
        run: python -u sequenciador_tabuleiro_m5.py

      - name: 19 - Avaliar resultados dos eventos
        run: python -u avaliador_resultados_m5.py

      - name: 20 - Gerar relatorio consolidado
        run: python -u relatorio_tabuleiro_m5.py

      # ==========================================
      # 6 - VALIDAR ARQUIVOS
      # ==========================================

      - name: 21 - Conferir arquivos produzidos
        shell: bash
        run: |
          set -e

          for arquivo in \
            data/memoria_agente.json \
            data/memoria_agente.csv \
            data/resultados_operacoes.csv \
            data/tabuleiro_m5.csv \
            data/eventos_bordas_m5.csv \
            data/tabuleiro_m5.db \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_resultados_m5.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv
          do
            if [ -s "$arquivo" ]; then
              echo "OK: $arquivo"
            else
              echo "ERRO: arquivo ausente ou vazio: $arquivo"
              exit 1
            fi
          done

      # ==========================================
      # 7 - PERSISTENCIA FINAL
      # ==========================================

      - name: 22 - Salvar memoria, bancos e historicos
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/memoria_agente.json \
            data/memoria_agente.csv \
            data/resultados_operacoes.csv \
            data/tabuleiro_m5.csv \
            data/tabuleiro_m5.db \
            data/eventos_bordas_m5.csv \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_resultados_m5.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza central inteligente e tabuleiro XAUUSD"
            git push origin HEAD:main
          else
            echo "Nenhuma alteracao nova para salvar."
          fi

      # ==========================================
      # 8 - PUBLICAR RELATORIOS
      # ==========================================

      - name: 23 - Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-central-inteligente-xauusd
          path: |
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
            data/proximas_regioes_m5.json
            data/resumo_resultados_m5.csv
          if-no-files-found: warn
          retention-days: 30
