on:
  workflow_run:
    workflows:
      - "Agente Gemini XAUUSD"
      - "Analise Diaria Gemini XAUUSD"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: central-inteligente-xauusd-${{ github.event.workflow_run.name || github.event_name }}
  cancel-in-progress: false
  
jobs:
  processamento:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.name == 'Agente Gemini XAUUSD' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ==========================================
      # 1 - PREPARAÇÃO
      # ==========================================

      - name: 1 - Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2 - Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3 - Preparar ambiente
        shell: bash
        run: |
          set -e
          mkdir -p data
          python --version
          echo "Ambiente preparado."

      # ==========================================
      # 2 - COORDENADOR
      # ==========================================

      - name: 4 - Verificar arquivos necessários
        shell: bash
        run: |
          set -e

          test -s data/memoria_agente.json
          test -s data/historico_velas_m5.csv

          echo "Memória e histórico encontrados."

      - name: 5 - Acompanhar sinais e resultados
        run: python -u acompanhar_operacoes_xau.py

      - name: 6 - Atualizar memória persistente
        run: python -u memoria_persistente_gemini.py

      - name: 7 - Conferir arquivos atualizados
        shell: bash
        run: |
          set -e
          test -s data/resultados_operacoes.csv
          test -s data/memoria_agente.csv
          echo "Memória e resultados atualizados."

      # ==========================================
      # 3 - LOCALIZAR INTEGRAÇÃO
      # ==========================================

      - name: 8 - Localizar integração de velas
        id: integracao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[]
              | select(.name == "Integracao XAUUSD Bot V2")
              | select(.conclusion == "success")]
              | sort_by(.created_at)
              | last
              | .id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "ERRO: nenhuma integração bem-sucedida encontrada."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Integração encontrada: $RUN_ID"

      - name: 9 - Baixar velas fechadas
        uses: actions/download-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data
          repository: ${{ github.repository }}
          run-id: ${{ steps.integracao.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 10 - Conferir CSV de velas
        shell: bash
        run: |
          set -e

          test -s data/xauusd_m5_fechados.csv

          echo "CSV de velas encontrado:"
          wc -l data/xauusd_m5_fechados.csv

      # ==========================================
      # 4 - TABULEIRO INTELIGENTE
      # ==========================================

      - name: 11 - Construir histórico do tabuleiro
        run: python -u coletor_tabuleiro_m5.py

      - name: 12 - Detectar bordas e eventos
        run: python -u detector_bordas_m5.py

      - name: 13 - Atualizar banco de dados
        run: python -u banco_dados_tabuleiro.py

      - name: 14 - Processar estatísticas das regiões
        run: python -u processador_estatistico_m5.py

      - name: 15 - Calcular sequências prováveis
        run: python -u sequenciador_tabuleiro_m5.py

      - name: 16 - Avaliar resultados dos eventos
        run: python -u avaliador_resultados_m5.py

      - name: 17 - Gerar relatório consolidado
        run: python -u relatorio_tabuleiro_m5.py

      # ==========================================
      # 5 - VALIDAR TODOS OS ARQUIVOS
      # ==========================================

      - name: 18 - Conferir arquivos produzidos
        shell: bash
        run: |
          set -e

          for arquivo in \
            data/memoria_agente.json \
            data/memoria_agente.csv \
            data/resultados_operacoes.csv \
            data/tabuleiro_m5.csv \
            data/eventos_bordas_m5.csv \
            data/tabuleiro_m5.db \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_resultados_m5.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv
          do
            if [ -s "$arquivo" ]; then
              echo "OK: $arquivo"
            else
              echo "ERRO: arquivo ausente ou vazio: $arquivo"
              exit 1
            fi
          done

      # ==========================================
      # 6 - PERSISTÊNCIA FINAL
      # ==========================================

      - name: 19 - Salvar memória, bancos e históricos
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/memoria_agente.json \
            data/memoria_agente.csv \
            data/resultados_operacoes.csv \
            data/tabuleiro_m5.csv \
            data/tabuleiro_m5.db \
            data/eventos_bordas_m5.csv \
            data/estatisticas_regioes_m5.csv \
            data/transicoes_probabilidade_m5.csv \
            data/sequencias_provaveis_m5.csv \
            data/proximas_regioes_m5.json \
            data/resultados_eventos_m5.csv \
            data/resumo_resultados_m5.csv \
            data/relatorio_tabuleiro_m5.json \
            data/relatorio_geral_tabuleiro_m5.csv

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza central inteligente e tabuleiro XAUUSD"
            git push origin HEAD:main
          else
            echo "Nenhuma alteração nova para salvar."
          fi

      # ==========================================
      # 7 - PUBLICAR RELATÓRIOS
      # ==========================================

      - name: 20 - Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-central-inteligente-xauusd
          path: |
            data/relatorio_tabuleiro_m5.json
            data/relatorio_geral_tabuleiro_m5.csv
            data/proximas_regioes_m5.json
            data/resumo_resultados_m5.csv
          if-no-files-found: warn
          retention-days: 30

          
  ponte_memoria_diaria:
    name: Receber conclusão diária do Gemini

    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'Analise Diaria Gemini XAUUSD' &&
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1 - Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2 - Receber conclusão do agente diário
        uses: actions/download-artifact@v4
        with:
          name: conclusao-diaria-gemini-xauusd
          path: recebimento
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 3 - Validar conclusão recebida
        shell: bash
        run: |
          set -euo pipefail

          test -s recebimento/analise_diaria_gemini.json

          python - <<'PY'
          import json

          caminho = "recebimento/analise_diaria_gemini.json"

          with open(caminho, encoding="utf-8") as arquivo:
              dados = json.load(arquivo)

          status = dados.get("status")

          if status not in ("concluido", "sem_dados_do_dia"):
              raise SystemExit(
                  f"Status inesperado na conclusão: {status}"
              )

          if not dados.get("dia_utc_analisado"):
              raise SystemExit(
                  "A conclusão não informa o dia UTC analisado."
              )

          print("Conclusão validada.")
          print("Status:", status)
          print("Dia UTC:", dados["dia_utc_analisado"])
          PY

      - name: 4 - Guardar memória diária na biblioteca
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            recebimento/analise_diaria_gemini.json \
            data/memoria_gemini_diaria.json

      - name: 5 - Persistir conclusão na biblioteca
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/memoria_gemini_diaria.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza memoria diaria Gemini XAUUSD"
            git push origin HEAD:main
          else
            echo "A memória diária já está atualizada."
          fi

      - name: 6 - Publicar confirmação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmacao-central-memoria-diaria
          path: data/memoria_gemini_diaria.json
          if-no-files-found: warn
          retention-days: 14

