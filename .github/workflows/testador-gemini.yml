
name: Testador e Seletor Gemini

on:
  workflow_dispatch:
  schedule:
    # Uma vez por dia, às 07:17 no horário de Brasília
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: testador-gemini
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar modelos e gravar ranking no banco oficial
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data

          python - <<'PY'
          import os
          import sys
          import json
          import time
          import sqlite3
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          from otimizador_parametros_setup import (
              SINAIS,
              abrir_sqlite_gz,
              compactar_sqlite_gz,
          )

          BASE = "https://generativelanguage.googleapis.com/v1beta"
          KEY = os.getenv("GEMINI_API_KEY", "").strip()

          OUTPUT = "data/modelo_gemini.json"
          HISTORICO = "data/historico_conexoes_gemini.json"

          TABELA = "SELECAO_MODELO_GEMINI"

          agora = datetime.now(timezone.utc).isoformat(
              timespec="seconds"
          )

          resultado = {
              "status": "iniciado",
              "modelo_escolhido": None,
              "modelos_rankeados": [],
              "modelos_testados": [],
              "criterio": "Menor numero de falhas; empate decidido pelo menor tempo medio.",
              "motivo": "",
              "atualizado_utc": agora
          }

          historico = {
              "versao": 2,
              "atualizado_utc": agora,
              "modelos": {},
              "eventos_api": []
          }

          if os.path.exists(HISTORICO):
              try:
                  with open(HISTORICO, "r", encoding="utf-8") as f:
                      salvo = json.load(f)

                  if isinstance(salvo, dict):
                      if isinstance(salvo.get("modelos"), dict):
                          historico = salvo

              except Exception as e:
                  print("Historico anterior invalido:", str(e))

          historico.setdefault("versao", 2)
          historico.setdefault("modelos", {})
          historico.setdefault("eventos_api", [])

          def salvar_json():
              momento = datetime.now(timezone.utc).isoformat(
                  timespec="seconds"
              )
              resultado["atualizado_utc"] = momento
              historico["atualizado_utc"] = momento

              with open(OUTPUT, "w", encoding="utf-8") as f:
                  json.dump(resultado, f, ensure_ascii=False, indent=2)

              with open(HISTORICO, "w", encoding="utf-8") as f:
                  json.dump(historico, f, ensure_ascii=False, indent=2)

          def registrar_evento_api(modelo, codigo, detalhe):
              historico.setdefault("eventos_api", [])
              historico["eventos_api"].append({
                  "modelo": modelo,
                  "http": codigo,
                  "tipo": "erro_api_ou_cota",
                  "detalhe": str(detalhe)[:500],
                  "registrado_utc": datetime.now(
                      timezone.utc
                  ).isoformat()
              })
              historico["eventos_api"] = historico["eventos_api"][-100:]

          def requisicao(url, body=None):
              headers = {"x-goog-api-key": KEY}
              data = None

              if body is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(body).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method="POST" if body is not None else "GET"
              )

              inicio = time.monotonic()

              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      conteudo = json.loads(
                          resp.read().decode("utf-8")
                      )

                  return conteudo, time.monotonic() - inicio, None

              except urllib.error.HTTPError as e:
                  texto = e.read().decode("utf-8", "replace")

                  try:
                      detalhe = json.loads(texto)
                  except Exception:
                      detalhe = {"message": texto[:500]}

                  return None, time.monotonic() - inicio, {
                      "code": e.code,
                      "detail": detalhe
                  }

              except Exception as e:
                  return None, time.monotonic() - inicio, {
                      "code": 0,
                      "detail": {"message": str(e)[:300]}
                  }

          def calcular_ranking():
              ranking = []

              for nome, reg in historico["modelos"].items():
                  tentativas = int(reg.get("tentativas", 0))
                  sucessos = int(reg.get("sucessos", 0))
                  falhas = int(reg.get("falhas", 0))

                  tempo_total = float(
                      reg.get("tempo_total_segundos", 0.0)
                  )

                  media = (
                      tempo_total / sucessos
                      if sucessos > 0 else None
                  )

                  ranking.append({
                      "modelo": nome,
                      "tempo_medio_segundos": (
                          round(media, 3) if media is not None else None
                      ),
                      "falhas": falhas,
                      "tentativas": tentativas,
                      "sucessos": sucessos
                  })

              ranking.sort(
                  key=lambda x: (
                      x["falhas"],
                      x["tempo_medio_segundos"]
                      if x["tempo_medio_segundos"] is not None
                      else 999999,
                      -x["sucessos"],
                      x["modelo"]
                  )
              )

              for posicao, item in enumerate(ranking, start=1):
                  item["posicao"] = posicao

              return ranking

          def gravar_ranking_banco(ranking):
              temporario, db_path, con = abrir_sqlite_gz(SINAIS)

              try:
                  con.execute("""
                      CREATE TABLE IF NOT EXISTS SELECAO_MODELO_GEMINI (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          atualizado_utc TEXT NOT NULL,
                          modelo TEXT NOT NULL,
                          tempo_medio_segundos REAL,
                          falhas INTEGER NOT NULL,
                          tentativas INTEGER NOT NULL,
                          sucessos INTEGER NOT NULL,
                          posicao INTEGER NOT NULL,
                          status_teste TEXT NOT NULL
                      )
                  """)

                  momento = datetime.now(timezone.utc).isoformat(
                      timespec="seconds"
                  )

                  testes_por_modelo = {
                      item["modelo"]: item
                      for item in resultado["modelos_testados"]
                  }

                  for item in ranking:
                      teste = testes_por_modelo.get(
                          item["modelo"], {}
                      )

                      status_teste = teste.get(
                          "resultado", "historico"
                      )

                      con.execute("""
                          INSERT INTO SELECAO_MODELO_GEMINI (
                              atualizado_utc,
                              modelo,
                              tempo_medio_segundos,
                              falhas,
                              tentativas,
                              sucessos,
                              posicao,
                              status_teste
                          )
                          VALUES (?, ?, ?, ?, ?, ?, ?, ?)
                      """, (
                          momento,
                          item["modelo"],
                          item["tempo_medio_segundos"],
                          item["falhas"],
                          item["tentativas"],
                          item["sucessos"],
                          item["posicao"],
                          status_teste
                      ))

                  con.commit()
                  con.close()

                  compactar_sqlite_gz(
                      temporario,
                      db_path,
                      SINAIS
                  )

                  print("Ranking gravado no banco oficial:", SINAIS)

              except Exception:
                  try:
                      con.rollback()
                      con.close()
                  except Exception:
                      pass

                  temporario.cleanup()
                  raise

          if not KEY:
              resultado["status"] = "erro"
              resultado["motivo"] = "Secret GEMINI_API_KEY ausente."
              salvar_json()
              sys.exit(1)

          print("1/4 - Consultando modelos Gemini...")

          dados, segundos_lista, erro = requisicao(
              BASE + "/models?pageSize=100"
          )

          if erro:
              codigo = erro["code"]

              registrar_evento_api(
                  "__listagem_modelos__",
                  codigo,
                  erro["detail"]
              )

              resultado["status"] = (
                  "erro_api_ou_cota"
                  if codigo in (400, 401, 403, 429)
                  else "erro_api"
              )

              resultado["motivo"] = (
                  "Consulta de modelos falhou. HTTP "
                  + str(codigo)
                  + ". "
                  + json.dumps(
                      erro["detail"],
                      ensure_ascii=False
                  )[:700]
              )

              salvar_json()
              print(resultado["motivo"])
              sys.exit(1)

          elegiveis = []

          for item in dados.get("models", []):
              nome = item.get("name", "")
              metodos = item.get(
                  "supportedGenerationMethods", []
              )

              if (
                  nome.startswith("models/gemini-")
                  and "generateContent" in metodos
                  and "embedding" not in nome.lower()
              ):
                  elegiveis.append(nome)

          def prioridade_nome(nome):
              n = nome.lower()

              if "flash-lite" in n:
                  return (0, n)

              if "flash" in n:
                  return (1, n)

              return (2, n)

          elegiveis = sorted(
              set(elegiveis),
              key=prioridade_nome
          )[:3]

          if not elegiveis:
              resultado["status"] = "sem_modelos_compativeis"
              resultado["motivo"] = (
                  "Nenhum modelo com generateContent foi encontrado."
              )
              salvar_json()
              sys.exit(1)

          print("2/4 - Testando", len(elegiveis), "modelos...")

          for nome in elegiveis:
              corpo = {
                  "contents": [{
                      "parts": [{
                          "text": "Responda somente: OK"
                      }]
                  }],
                  "generationConfig": {
                      "temperature": 0,
                      "maxOutputTokens": 5
                  }
              }

              resposta, segundos, falha = requisicao(
                  BASE + "/" + nome + ":generateContent",
                  corpo
              )

              codigo = falha["code"] if falha else 200
              texto = ""

              if not falha:
                  partes = (
                      resposta.get("candidates", [{}])[0]
                      .get("content", {})
                      .get("parts", [])
                  )

                  texto = "".join(
                      p.get("text", "") for p in partes
                  ).strip()

              sucesso = bool(texto)

              item = {
                  "modelo": nome,
                  "segundos": round(segundos, 3),
                  "resultado": (
                      "sucesso" if sucesso else "falha"
                  ),
                  "http": codigo
              }

              if falha:
                  item["detalhe"] = json.dumps(
                      falha["detail"],
                      ensure_ascii=False
                  )[:400]
              elif not texto:
                  item["resultado"] = "resposta_vazia"

              resultado["modelos_testados"].append(item)

              # Erros de autenticacao, cota ou requisicao global
              # nao devem ser contabilizados como falha do modelo.
              if codigo in (400, 401, 403, 429):
                  registrar_evento_api(
                      nome,
                      codigo,
                      item.get("detalhe", "")
                  )

                  resultado["status"] = "erro_api_ou_cota"
                  resultado["motivo"] = (
                      "Teste interrompido por erro de API ou cota. "
                      "O evento foi registrado sem penalizar o modelo."
                  )
                  print("Teste interrompido. HTTP:", codigo)
                  break

              registro = historico["modelos"].setdefault(
                  nome,
                  {
                      "tentativas": 0,
                      "sucessos": 0,
                      "falhas": 0,
                      "tempo_total_segundos": 0.0
                  }
              )

              registro["tentativas"] = (
                  int(registro.get("tentativas", 0)) + 1
              )

              if sucesso:
                  registro["sucessos"] = (
                      int(registro.get("sucessos", 0)) + 1
                  )
                  registro["tempo_total_segundos"] = (
                      float(
                          registro.get(
                              "tempo_total_segundos", 0.0
                          )
                      ) + segundos
                  )
              else:
                  registro["falhas"] = (
                      int(registro.get("falhas", 0)) + 1
                  )

              registro["ultimo_http"] = codigo
              registro["ultima_tentativa_utc"] = (
                  datetime.now(timezone.utc).isoformat()
              )

              print(
                  nome,
                  "=>",
                  item["resultado"],
                  "=>",
                  round(segundos, 2),
                  "segundos"
              )

          print("3/4 - Calculando ranking...")

          ranking = calcular_ranking()

          resultado["ranking"] = ranking
          resultado["modelos_rankeados"] = ranking

          if ranking:
              resultado["modelo_escolhido"] = ranking[0]["modelo"]

              if resultado["status"] == "iniciado":
                  resultado["status"] = "pronto"

              resultado["motivo"] = (
                  "Ranking por menor numero de falhas; "
                  "desempate pelo menor tempo medio de resposta."
              )
          else:
              resultado["status"] = "sem_historico"
              resultado["motivo"] = (
                  "Ainda nao existem resultados individuais suficientes."
              )

          salvar_json()

          print("4/4 - Gravando ranking no banco oficial...")
          gravar_ranking_banco(ranking)

          salvar_json()

          print(json.dumps(
              resultado,
              ensure_ascii=False,
              indent=2
          ))

          if not ranking:
              sys.exit(1)
          PY

      - name: Salvar banco e historico no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sinais.db.gz
          git add data/historico_conexoes_gemini.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza ranking e historico Gemini"
            git push
          else
            echo "Sem alteracoes para salvar."
          fi

      - name: Publicar resultado do testador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selecao-modelo-gemini
          path: data/modelo_gemini.json
          if-no-files-found: ignore
          retention-days: 7
