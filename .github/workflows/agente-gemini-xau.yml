name: Agente Gemini XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: agente-gemini-xau
  cancel-in-progress: false

jobs:
  agente:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Recuperar memoria e resultados da execucao anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/memoria_anterior data/estado_anterior

          # Memoria consolidada pelo workflow Memoria Persistente XAUUSD.
          MEMORIA_RUN=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow memoria-persistente-xauusd.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$MEMORIA_RUN" ]; then
            gh run download "$MEMORIA_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name memoria-agente-xau \
              --dir data/memoria_anterior || true
          fi

          # O acompanhamento CSV e os parametros adaptativos sao
          # preservados como artefatos do proprio agente.
          ANTERIOR_RUN=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow agente-gemini-xau.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$ANTERIOR_RUN" ]; then
            gh run download "$ANTERIOR_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name acompanhamento-operacoes-xau \
              --dir data/estado_anterior || true
            gh run download "$ANTERIOR_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name parametros-adaptativos-xau \
              --dir data/estado_anterior || true
          fi

          if [ -f data/memoria_anterior/memoria_agente.json ]; then
            cp data/memoria_anterior/memoria_agente.json data/memoria_agente.json
          else
            printf '{"historico":[],"total_registros":0}\n' > data/memoria_agente.json
          fi

          if [ -f data/estado_anterior/resultados_operacoes.csv ]; then
            cp data/estado_anterior/resultados_operacoes.csv data/resultados_operacoes.csv
          fi

          if [ -f data/estado_anterior/parametros_adaptativos.json ]; then
            cp data/estado_anterior/parametros_adaptativos.json data/parametros_adaptativos.json
          else
            printf '{"peso_tecnico":75,"peso_gemini":25,"limiar":40,"stop_atr":1.5,"rr":1.5}\n' > data/parametros_adaptativos.json
          fi

      - name: Selecionar modelo com fallback para o ultimo usado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/selecao_testador data/modelo_anterior
          SELECAO_OK=""

          # 1) Prioridade: ultima selecao bem-sucedida do Testador.
          TESTADOR_RUN=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$TESTADOR_RUN" ]; then
            echo "Testador encontrado: $TESTADOR_RUN"
            gh run download "$TESTADOR_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name selecao-modelo-gemini \
              --dir data/selecao_testador || true
          else
            echo "Testador sem execucao bem-sucedida. Tentarei recuperar o ultimo modelo usado pelo agente."
          fi

          # Valida a selecao do Testador antes de usa-la.
          if [ -f data/selecao_testador/modelo_gemini.json ]; then
            if python - <<'PYVALIDA'
          import json
          from pathlib import Path
          p = Path("data/selecao_testador/modelo_gemini.json")
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              m = d.get("modelo_escolhido", "")
              ok = d.get("status") in ("pronto", "pronto_com_aviso_api") and isinstance(m, str) and m.startswith("models/gemini-")
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
          PYVALIDA
            then
              cp data/selecao_testador/modelo_gemini.json data/modelo_gemini.json
              SELECAO_OK="testador"
              echo "Modelo selecionado pela ultima execucao valida do Testador."
            fi
          fi

          # 2) Fallback: resultado da ultima execucao bem-sucedida do proprio agente.
          if [ -z "$SELECAO_OK" ]; then
            echo "Tentando recuperar o modelo utilizado pelo ultimo agente bem-sucedido..."
            AGENTE_RUN=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow agente-gemini-xau.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -n "$AGENTE_RUN" ]; then
              gh run download "$AGENTE_RUN" \
                --repo "$GITHUB_REPOSITORY" \
                --name resultado-agente-gemini \
                --dir data/modelo_anterior || true
            fi

            if [ -f data/modelo_anterior/decisao_gemini.json ]; then
              python - <<'PYFALLBACK'
          import json
          from pathlib import Path

          origem = Path("data/modelo_anterior/decisao_gemini.json")
          try:
              resultado = json.loads(origem.read_text(encoding="utf-8"))
              modelo = resultado.get("modelo_utilizado", "")
          except Exception as erro:
              raise SystemExit(f"Nao foi possivel ler o modelo anterior: {erro}")

          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("O ultimo resultado do agente nao contem um modelo valido.")

          selecao = {
              "status": "pronto",
              "modelo_escolhido": modelo,
              "origem": "fallback_ultimo_modelo_do_agente"
          }
          Path("data/modelo_gemini.json").write_text(
              json.dumps(selecao, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("Modelo recuperado do ultimo resultado do agente:", modelo)
          PYFALLBACK
              SELECAO_OK="memoria_agente"
            fi
          fi

          if [ -z "$SELECAO_OK" ] || [ ! -f data/modelo_gemini.json ]; then
            echo "::error::Nao existe selecao valida no Testador nem modelo anterior valido no historico do agente."
            exit 1
          fi

          echo "Origem final do modelo: $SELECAO_OK"
          cat data/modelo_gemini.json

      - name: Receber candles para acompanhamento e ATR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Integracao XAUUSD Bot V2" \
            --branch "$UPSTREAM_BRANCH" \
            --status success \
            --limit 100 \
            --json databaseId,headBranch,createdAt \
            --jq "map(select(
              .headBranch == \"$UPSTREAM_BRANCH\" and
              .createdAt <= \"$UPSTREAM_CREATED_AT\"
            )) | sort_by(.createdAt) | last | .databaseId // empty")

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma integracao bem-sucedida anterior a analise foi encontrada."
            exit 1
          fi

          mkdir -p data/candles
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name candles-xauusd-m5 \
            --dir data/candles

          test -f data/candles/xauusd_m5_fechados.csv || {
            echo "::error::CSV de candles fechados nao encontrado."
            exit 1
          }

      - name: Validar arquivos recebidos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          analise = json.loads(Path("data/analise_tecnica_contexto.json").read_text(encoding="utf-8"))
          selecao = json.loads(Path("data/modelo_gemini.json").read_text(encoding="utf-8"))

          if not isinstance(analise, dict) or not analise:
              raise SystemExit("Analise tecnica vazia ou invalida.")
          if selecao.get("status") not in ("pronto", "pronto_com_aviso_api"):
              raise SystemExit("A selecao de modelo nao esta pronta.")
          modelo = selecao.get("modelo_escolhido", "")
          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("Nome de modelo invalido.")
          print("Arquivos validados. Modelo:", modelo)
          PY

      - name: Acompanhar operacoes e atualizar resultados
        run: |
          set -euo pipefail
          if [ -f acompanhar_operacoes_xau.py ]; then
            python acompanhar_operacoes_xau.py
          else
            echo "::error::acompanhar_operacoes_xau.py nao encontrado na raiz do repositorio."
            exit 1
          fi

          test -f data/resultados_operacoes.csv || {
            echo "::error::O acompanhamento nao gerou data/resultados_operacoes.csv."
            exit 1
          }

      - name: Preparar memoria atualizada para o Gemini
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          base = Path("data")
          arquivos = {
              "memoria_json": base / "memoria_agente.json",
              "resultados_reais": base / "resultados_operacoes.csv",
              "historico_sinais": base / "historico_sinais.json",
              "parametros_anteriores": base / "parametros_adaptativos.json",
          }

          dados = {}
          for nome, caminho in arquivos.items():
              if not caminho.exists():
                  dados[nome] = None
                  continue
              if caminho.suffix == ".json":
                  dados[nome] = json.loads(caminho.read_text(encoding="utf-8"))
              else:
                  with caminho.open(encoding="utf-8-sig", newline="") as f:
                      dados[nome] = list(csv.DictReader(f, delimiter=";"))

          Path("data/memoria_para_gemini.json").write_text(
              json.dumps(dados, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("Memoria, resultados e parametros anteriores preparados.")
          PY

      - name: Gemini interpreta, aprende e propoe ajustes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error, math
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://generativelanguage.googleapis.com/v1beta"
          analise = json.loads(Path("data/analise_tecnica_contexto.json").read_text(encoding="utf-8"))
          selecao = json.loads(Path("data/modelo_gemini.json").read_text(encoding="utf-8"))
          memoria = json.loads(Path("data/memoria_para_gemini.json").read_text(encoding="utf-8"))
          chave = os.getenv("GEMINI_API_KEY", "").strip()
          modelo = selecao.get("modelo_escolhido")
          if not chave:
              sys.exit("Secret GEMINI_API_KEY ausente.")
          if selecao.get("status") not in ("pronto", "pronto_com_aviso_api") or not modelo:
              sys.exit("Nenhum modelo validado.")

          parametros_anteriores = memoria.get("parametros_anteriores") or {}
          prompt = """
          Voce e o agente decisor e aprendiz autonomo de XAUUSD M5.
          Interprete o mercado com liberdade analitica. Nao fique preso
          a alinhamento perfeito de tempos graficos nem a uma lista fixa
          de padroes. Pese contexto, estrutura, impulso, volatilidade,
          continuacao, reversao, esgotamento, rompimentos e contradicoes
          conforme fizer sentido nos dados recebidos.

          CICLO DE APRENDIZADO:
          Examine o historico e os resultados de operacoes. Separe
          rigorosamente resultados REAIS, HIPOTETICOS, EM_ABERTO,
          SEM_NIVEIS, STOP, ALVO e AMBIGUO. Somente resultados reais
          encerrados podem fundamentar conclusoes sobre desempenho.
          Nao conte operacoes abertas como perdas nem hipoteticas como
          resultados reais. Identifique o que funcionou, o que falhou,
          contexto dos stops, entradas tardias/antecipadas e mudancas
          de regime. Amostras pequenas devem gerar cautela, nao certezas.

          Voce pode propor e ajustar os parametros do proprio agente:
          pesos tecnico e Gemini (soma 100), limiar de decisao,
          multiplicador ATR do stop e relacao risco-retorno. Use os
          resultados observados para justificar mudancas graduais.
          Se nao houver amostra real suficiente, mantenha os parametros
          anteriores; nao invente estatisticas. Nao altere o motor
          tecnico upstream nem fabrique dados.

          A decisao pode ser COMPRA, VENDA ou SEM_SINAL.
          Confianca e avaliacao subjetiva da IA, nao taxa comprovada.
          Nao execute ordens e nao prometa lucro.

          Responda SOMENTE JSON valido neste formato:
          {
            "decisao":"SEM_SINAL",
            "confianca":0,
            "justificativa":"analise objetiva",
            "aprendizado":"o que os resultados indicam",
            "parametros":{
              "peso_tecnico":75,
              "peso_gemini":25,
              "limiar":40,
              "stop_atr":1.5,
              "rr":1.5
            }
          }

          DADOS TECNICOS ATUAIS:
          """ + json.dumps(analise, ensure_ascii=False) + """

          MEMORIA, RESULTADOS E PARAMETROS ANTERIORES:
          """ + json.dumps(memoria, ensure_ascii=False)

          corpo = {
              "contents":[{"parts":[{"text":prompt}]}],
              "generationConfig":{
                  "temperature":0.35,
                  "maxOutputTokens":900,
                  "responseMimeType":"application/json"
              }
          }

          # O Testador escolhe o principal. O ranking historico define
          # a ordem dos reservas; modelos ja aprovados no teste atual
          # entram depois, sem duplicar nomes.
          modelo_solicitado = modelo
          candidatos = [modelo]

          for item in selecao.get("ranking", []):
              nome = item.get("modelo")
              try:
                  sucessos = int(item.get("sucessos", 0))
              except (TypeError, ValueError):
                  sucessos = 0
              if (
                  sucessos > 0
                  and isinstance(nome, str)
                  and nome.startswith("models/gemini-")
                  and nome not in candidatos
              ):
                  candidatos.append(nome)

          for item in selecao.get("modelos_testados", []):
              nome = item.get("modelo")
              if (
                  item.get("resultado") == "sucesso"
                  and isinstance(nome, str)
                  and nome.startswith("models/gemini-")
                  and nome not in candidatos
              ):
                  candidatos.append(nome)

          decisao = None
          erros = []
          fallback_acionado = False

          for indice, nome_modelo in enumerate(candidatos):
              if indice > 0:
                  fallback_acionado = True
                  print("Tentando modelo reserva:", nome_modelo)

              for tentativa in range(2):
                  pedido = urllib.request.Request(
                      BASE + "/" + nome_modelo + ":generateContent",
                      data=json.dumps(corpo).encode(),
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": chave
                      },
                      method="POST"
                  )
                  try:
                      with urllib.request.urlopen(
                          pedido, timeout=60
                      ) as resp:
                          resposta = json.loads(resp.read().decode())

                      decisao = json.loads(
                          resposta["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )
                      modelo = nome_modelo
                      break

                  except urllib.error.HTTPError as e:
                      detalhe = e.read().decode(
                          "utf-8", "replace"
                      )[:1000]
                      erros.append(
                          f"{nome_modelo} HTTP {e.code}: {detalhe}"
                      )

                      # Quota (429), modelo inexistente (404) e
                      # indisponibilidade (5xx/408): passa ao reserva.
                      # Falhas temporarias recebem uma segunda tentativa.
                      if e.code in (408, 500, 502, 503, 504) and tentativa == 0:
                          import time
                          time.sleep(2)
                          continue

                      if e.code in (400, 401, 403):
                          sys.exit(
                              "Erro Gemini que nao se resolve trocando modelo. "
                              + "HTTP " + str(e.code) + ": " + detalhe
                          )

                      print(
                          f"Modelo {nome_modelo} indisponivel nesta tentativa "
                          f"(HTTP {e.code}); seguindo para o proximo."
                      )
                      break

                  except Exception as e:
                      erros.append(
                          f"{nome_modelo}: {str(e)[:500]}"
                      )
                      if tentativa == 0:
                          import time
                          time.sleep(2)
                          continue
                      break

              if decisao is not None:
                  break

          if decisao is None:
              sys.exit(
                  "Todos os modelos Gemini disponiveis falharam. "
                  + " | ".join(erros[:5])
              )
          print("Modelo efetivamente utilizado:", modelo)
          print("Fallback acionado:", fallback_acionado)

          lado = decisao.get("decisao")
          if lado not in ("COMPRA","VENDA","SEM_SINAL"):
              sys.exit("Decisao da IA invalida.")
          try:
              confianca = int(decisao.get("confianca",0))
          except (ValueError,TypeError):
              sys.exit("Confianca invalida.")
          if not 0 <= confianca <= 100:
              sys.exit("Confianca fora do intervalo.")

          def num(x, padrao):
              try:
                  y=float(x)
                  return y if math.isfinite(y) else padrao
              except (ValueError,TypeError):
                  return padrao

          p = decisao.get("parametros") or {}
          anterior = memoria.get("parametros_anteriores") or {}
          peso_t = num(p.get("peso_tecnico"), num(anterior.get("peso_tecnico"),75))
          peso_g = num(p.get("peso_gemini"), num(anterior.get("peso_gemini"),25))
          if peso_t <= 0 or peso_g <= 0:
              peso_t, peso_g = 75.0, 25.0
          total = peso_t + peso_g
          peso_t, peso_g = peso_t*100/total, peso_g*100/total
          limiar = num(p.get("limiar"), num(anterior.get("limiar"),40))
          stop_atr = num(p.get("stop_atr"), num(anterior.get("stop_atr"),1.5))
          rr = num(p.get("rr"), num(anterior.get("rr"),1.5))
          # Limites de seguranca para evitar parametros absurdos ou erros de formato.
          limiar = max(1.0,min(95.0,limiar))
          stop_atr = max(0.5,min(4.0,stop_atr))
          rr = max(0.5,min(5.0,rr))

          def pontuacao_tecnica(lado):
              novo = "pontuacao_tecnica_compra" if lado=="COMPRA" else "pontuacao_tecnica_venda"
              antigo = "pontuacao_compra" if lado=="COMPRA" else "pontuacao_venda"
              v = analise.get(novo)
              if v is not None:
                  return max(0.0,min(75.0,float(v))), "campo_tecnico_75"
              v = analise.get(antigo)
              if v is not None:
                  return max(0.0,min(75.0,float(v)*75.0/6.0)), "campo_antigo_normalizado"
              return None, "pontuacao_tecnica_ausente"

          tc, fc = pontuacao_tecnica("COMPRA")
          tv, fv = pontuacao_tecnica("VENDA")
          tecnico = tc if lado=="COMPRA" else tv if lado=="VENDA" else None
          fonte = fc if lado=="COMPRA" else fv if lado=="VENDA" else "sem_direcao_da_ia"
          contribuicao = confianca * peso_g / 100.0
          if lado=="SEM_SINAL" or tecnico is None:
              final, lado_final = None, "SEM_SINAL"
          else:
              # Normaliza o motor tecnico original (escala 0-75) para o peso adaptado.
              final = round((tecnico/75.0)*peso_t + contribuicao,2)
              lado_final = lado if final >= limiar else "SEM_SINAL"

          parametros = {
              "peso_tecnico":round(peso_t,2),
              "peso_gemini":round(peso_g,2),
              "limiar":round(limiar,2),
              "stop_atr":round(stop_atr,3),
              "rr":round(rr,3)
          }
          Path("data/parametros_adaptativos.json").write_text(
              json.dumps(parametros,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          resultado = {
              "ativo":"XAUUSD","timeframe":"M5",
              "candle_utc":analise.get("candle_utc"),
              "decisao_motor":analise.get("decisao"),
              "modelo_utilizado":modelo,
              "modelo_solicitado_pelo_testador":modelo_solicitado,
              "fallback_modelo_acionado":fallback_acionado,
              "erros_modelos_anteriores":erros[:5],
              "decisao_ia_original":lado,
              "decisao_gemini":lado_final,
              "confianca_declarada":confianca,
              "pontuacao_tecnica_compra":tc,
              "pontuacao_tecnica_venda":tv,
              "fonte_pontuacao_tecnica":fonte,
              "pontuacao_tecnica_direcao":tecnico,
              "contribuicao_gemini":round(contribuicao,2),
              "pontuacao_final":final,
              "parametros_adaptativos":parametros,
              "aprendizado":str(decisao.get("aprendizado",""))[:1500],
              "justificativa":str(decisao.get("justificativa",""))[:1500],
              "gerado_utc":datetime.now(timezone.utc).isoformat(),
              "modo_teste":True,"envio_telegram":False,"execucao_ordens":False
          }
          Path("data/decisao_gemini.json").write_text(
              json.dumps(resultado,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps(resultado,ensure_ascii=False,indent=2))
          PY

      - name: Calcular entrada stop e alvo com parametros aprendidos
        run: |
          python - <<'PY'
          import csv,json,math
          from pathlib import Path

          csv_path=Path("data/candles/xauusd_m5_fechados.csv")
          path=Path("data/decisao_gemini.json")
          d=json.loads(path.read_text(encoding="utf-8"))
          if d.get("decisao_gemini") not in ("COMPRA","VENDA"):
              print("SEM_SINAL: calculo dispensado.")
              raise SystemExit(0)

          with csv_path.open(encoding="utf-8-sig",newline="") as f:
              reader=csv.DictReader(f)
              def norm(s): return "".join(c.lower() for c in s.strip() if c.isalnum())
              cols={norm(x):x for x in (reader.fieldnames or [])}
              def col(*names):
                  for n in names:
                      if norm(n) in cols: return cols[norm(n)]
                  raise SystemExit("Coluna ausente: "+", ".join(names))
              hi,lo,cl=col("high","max","maximum"),col("low","min","minimum"),col("close","fechamento","last")
              rows=list(reader)
          if len(rows)<15: raise SystemExit("Sao necessarios pelo menos 15 candles.")
          def value(row,key):
              x=float(row[key])
              if not math.isfinite(x): raise ValueError("Preco invalido")
              return x
          candles=[(value(r,hi),value(r,lo),value(r,cl)) for r in rows]
          trs=[]
          for i in range(len(candles)-14,len(candles)):
              h,l,c=candles[i]
              prev=candles[i-1][2]
              trs.append(max(h-l,abs(h-prev),abs(l-prev)))
          atr=sum(trs)/14
          entrada=candles[-1][2]
          p=d["parametros_adaptativos"]
          distancia=atr*float(p["stop_atr"])
          alvo_dist=distancia*float(p["rr"])
          if atr<=0 or not math.isfinite(atr): raise SystemExit("ATR invalido.")
          if d["decisao_gemini"]=="COMPRA":
              stop,alvo=entrada-distancia,entrada+alvo_dist
          else:
              stop,alvo=entrada+distancia,entrada-alvo_dist
          d.update({
              "entrada":round(entrada,3),"atr14":round(atr,5),
              "distancia_stop":round(distancia,3),
              "stop_loss":round(stop,3),"take_profit":round(alvo,3),
              "distancia_alvo":round(alvo_dist,3),
              "relacao_risco_retorno":f"1:{p['rr']}",
              "metodo_stop":f"ATR(14) x {p['stop_atr']}",
              "metodo_alvo":f"Distancia do stop x {p['rr']}"
          })
          path.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Niveis calculados:",d["entrada"],d["stop_loss"],d["take_profit"])
          PY

      - name: Verificar sinal repetido
        id: duplicidade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/historico_anterior
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow agente-gemini-xau.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name historico-agente-gemini \
              --dir data/historico_anterior || true
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          atual=json.loads(Path("data/decisao_gemini.json").read_text(encoding="utf-8"))
          arquivo=Path("data/historico_anterior/historico_sinais.json")
          historico=[]
          if arquivo.exists():
              try: historico=json.loads(arquivo.read_text(encoding="utf-8"))
              except Exception: historico=[]
          if not isinstance(historico,list): historico=[]
          lado,candle=atual.get("decisao_gemini"),atual.get("candle_utc")
          duplicado=bool(lado in ("COMPRA","VENDA") and candle and any(
              x.get("candle_utc")==candle and
              x.get("decisao_gemini")==lado and
              x.get("envio_telegram") is True
              for x in historico if isinstance(x,dict)
          ))
          Path("data/duplicidade.json").write_text(json.dumps({"duplicado":duplicado}))
          print("Sinal repetido:",duplicado)
          PY
          DUPLICADO=$(python -c "import json; print(str(json.load(open('data/duplicidade.json'))['duplicado']).lower())")
          echo "duplicado=$DUPLICADO" >> "$GITHUB_OUTPUT"

      - name: Enviar sinal para o Telegram
        if: steps.duplicidade.outputs.duplicado != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,json,sys,urllib.request,urllib.parse
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from zoneinfo import ZoneInfo

          d=json.loads(Path("data/decisao_gemini.json").read_text(encoding="utf-8"))
          lado=d.get("decisao_gemini","SEM_SINAL")
          if lado not in ("COMPRA","VENDA"):
              print("SEM_SINAL: nenhuma mensagem enviada.")
              raise SystemExit(0)
          token=os.getenv("TELEGRAM_BOT_TOKEN","").strip()
          chat=os.getenv("TELEGRAM_CHAT_ID","").strip()
          if not token or not chat: sys.exit("Configure os Secrets do Telegram.")
          for k in ("entrada","stop_loss","take_profit","distancia_stop","pontuacao_final"):
              if d.get(k) is None: sys.exit("Dados obrigatorios ausentes: "+k)
          utc=datetime.now(timezone.utc)
          candle=d.get("candle_utc") or "Nao informado"
          try:
              abertura=datetime.fromisoformat(str(candle).replace("Z","+00:00"))
              if abertura.tzinfo is None: abertura=abertura.replace(tzinfo=timezone.utc)
              fechamento=abertura.astimezone(timezone.utc)+timedelta(minutes=5)
              atraso=(utc-fechamento).total_seconds()/60
              fechamento_txt=fechamento.astimezone(ZoneInfo("America/Sao_Paulo")).strftime("%H:%M:%S")
              atraso_txt=f"{atraso:.1f} min"
          except Exception:
              fechamento_txt="Nao calculado"; atraso_txt="Nao calculado"
          emoji="🟢" if lado=="COMPRA" else "🔴"
          p=d["parametros_adaptativos"]
          msg=(
              f"🥇 <b>XAUUSD · OURO</b>\n⏱ Timeframe: M5\n\n"
              f"{emoji} <b>{lado}</b>\n\n"
              f"💰 Entrada: <code>{d['entrada']:.3f}</code>\n"
              f"🛑 Stop-loss: <code>{d['stop_loss']:.3f}</code>\n"
              f"🎯 Alvo: <code>{d['take_profit']:.3f}</code>\n"
              f"📏 Distância do stop: <code>{d['distancia_stop']:.3f}</code>\n"
              f"📐 Risco-retorno: <b>1:{p['rr']}</b>\n"
              f"📊 Pontuação final: <b>{d['pontuacao_final']}/100</b>\n"
              f"🧠 Confiança IA: <b>{d['confianca_declarada']}%</b>\n"
              f"⚖️ Pesos técnico/IA: {p['peso_tecnico']}/{p['peso_gemini']} · Limiar: {p['limiar']}\n\n"
              f"📝 {str(d.get('justificativa',''))[:700]}\n\n"
              f"🕯️ Abertura candle UTC: {candle}\n"
              f"🔔 Fechamento candle (Brasília): {fechamento_txt}\n"
              f"⏱️ Atraso após fechamento: {atraso_txt}\n"
              f"⚠️ Sinal experimental. Não é garantia de lucro."
          )
          req=urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=urllib.parse.urlencode({
                  "chat_id":chat,"text":msg,"parse_mode":"HTML",
                  "disable_web_page_preview":"true"
              }).encode(),
              headers={"Content-Type":"application/x-www-form-urlencoded"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  retorno=json.loads(r.read().decode())
              if not retorno.get("ok"): sys.exit("Telegram nao confirmou o envio.")
              d["envio_telegram"]=True
              d["horario_sinal_utc"]=utc.isoformat()
              d["fechamento_candle_utc"]=fechamento.isoformat() if "fechamento" in locals() else None
              d["atraso_apos_fechamento_minutos"]=round(atraso,2) if "atraso" in locals() else None
              Path("data/decisao_gemini.json").write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
              print("Mensagem enviada ao Telegram.")
          except Exception as e:
              sys.exit("Falha no envio ao Telegram: "+str(e))
          PY

      - name: Registrar decisao no historico
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          atual=Path("data/decisao_gemini.json")
          anterior=Path("data/historico_anterior/historico_sinais.json")
          historico=[]
          if anterior.exists():
              try: historico=json.loads(anterior.read_text(encoding="utf-8"))
              except Exception: historico=[]
          if not isinstance(historico,list): historico=[]
          if atual.exists():
              try:
                  novo=json.loads(atual.read_text(encoding="utf-8"))
                  chave=(novo.get("candle_utc"),novo.get("decisao_gemini"))
                  if not any((x.get("candle_utc"),x.get("decisao_gemini"))==chave for x in historico if isinstance(x,dict)):
                      historico.append(novo)
              except Exception as e: print("Falha ao registrar decisao:",e)
          Path("data/historico_sinais.json").write_text(
              json.dumps(historico[-500:],ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print("Historico preparado:",len(historico[-500:]))
          PY

      - name: Guardar historico do agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historico-agente-gemini
          path: data/historico_sinais.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar acompanhamento e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acompanhamento-operacoes-xau
          path: |
            data/resultados_operacoes.csv
            data/memoria_agente.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar parametros adaptativos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parametros-adaptativos-xau
          path: data/parametros_adaptativos.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar decisao do agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-agente-gemini
          path: data/decisao_gemini.json
          if-no-files-found: ignore
          retention-days: 90
