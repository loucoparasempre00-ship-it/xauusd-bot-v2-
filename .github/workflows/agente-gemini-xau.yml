name: Agente Gemini XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: agente-gemini-xau
  cancel-in-progress: false

jobs:
  agente:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Localizar ultima selecao bem-sucedida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma execucao bem-sucedida do testador foi encontrada."
            exit 1
          fi

          mkdir -p data

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name selecao-modelo-gemini \
            --dir data

          test -f data/modelo_gemini.json || {
            echo "::error::Arquivo de selecao de modelo ausente."
            exit 1
          }

      - name: Receber candles para entrada e ATR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Integracao XAUUSD Bot V2" \
            --status success \
            --limit 30 \
            --json databaseId,headSha,createdAt \
            --jq "map(select(.headSha == \"$UPSTREAM_SHA\")) | sort_by(.createdAt) | last | .databaseId // empty")

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma integracao bem-sucedida encontrada para este commit."
            exit 1
          fi

          mkdir -p data/candles

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name candles-xauusd-m5 \
            --dir data/candles

          test -f data/candles/xauusd_m5_fechados.csv || {
            echo "::error::CSV de candles fechados nao encontrado."
            exit 1
          }

          echo "Candles recebidos."

      - name: Validar arquivos recebidos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          analise = json.loads(
              Path("data/analise_tecnica_contexto.json").read_text(
                  encoding="utf-8"
              )
          )

          selecao = json.loads(
              Path("data/modelo_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(analise, dict) or not analise:
              raise SystemExit("Analise tecnica vazia ou invalida.")

          if selecao.get("status") != "pronto":
              raise SystemExit("A selecao de modelo nao esta pronta.")

          modelo = selecao.get("modelo_escolhido", "")

          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("Nome de modelo invalido.")

          print("Analise tecnica validada.")
          print("Modelo selecionado:", modelo)
          PY

      - name: Carregar memoria historica para o Gemini
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          arquivos = {
              "memoria_json": Path("data/memoria_agente.json"),
              "memoria_csv": Path("data/memoria_agente.csv"),
              "resultados": Path("data/resultados_operacoes.csv")
          }

          memoria = {}

          for nome, caminho in arquivos.items():
              if not caminho.exists():
                  print(f"Aviso: {caminho} nao encontrado.")
                  memoria[nome] = None
                  continue

              if caminho.suffix == ".json":
                  try:
                      memoria[nome] = json.loads(
                          caminho.read_text(encoding="utf-8")
                      )
                  except Exception as erro:
                      raise SystemExit(
                          f"Erro ao ler {caminho}: {erro}"
                      )
              else:
                  with caminho.open(
                      encoding="utf-8-sig",
                      newline=""
                  ) as arquivo:
                      memoria[nome] = list(csv.DictReader(arquivo))

              print(f"{caminho}: carregado.")

          Path("data/memoria_para_gemini.json").write_text(
              json.dumps(memoria, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Memoria historica preparada para analise.")
          PY

      - name: Agente interpreta o mercado e calcula pontuacao final
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = "https://generativelanguage.googleapis.com/v1beta"

          analise = json.loads(
              Path("data/analise_tecnica_contexto.json").read_text(
                  encoding="utf-8"
              )
          )

          selecao = json.loads(
              Path("data/modelo_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          chave = os.getenv("GEMINI_API_KEY", "").strip()
          modelo = selecao.get("modelo_escolhido")

          if not chave:
              sys.exit("Secret GEMINI_API_KEY ausente.")

          if selecao.get("status") != "pronto" or not modelo:
              sys.exit("Nenhum modelo validado.")

          memoria = json.loads(
              Path("data/memoria_para_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          prompt = """
          Voce e um analista tecnico proativo de XAUUSD M5.

          MANTENHA TODA A LOGICA DE ANALISE E DECISAO
          QUE JA EXISTE. A memoria historica e uma camada
          adicional de avaliacao, nao uma substituicao.

          Analise os dados recebidos sem inventar valores.
          Considere continuacao de tendencia, reversao,
          impulso, rompimento, esgotamento e conflitos entre
          os tempos graficos quando esses dados existirem.

          Nao exija alinhamento perfeito entre M5, M15 e H1.
          Nao invente indicadores que nao estejam nos dados.
          Nao invente precos, noticias, entrada, stop ou alvo.
          Nao execute ordens.
          Nao prometa lucro.

          APRENDIZADO COM HISTORICO:

          Leia os registros de memoria e resultados anteriores.

          Compare sinais vencedores, stops, sinais em aberto
          e sinais sem direcao.

          Procure identificar:
          - Condicoes que antecederam os stops.
          - Entradas antecipadas ou tardias.
          - Falsos rompimentos.
          - Conflitos com a tendencia.
          - Condicoes de volatilidade.
          - Padroes presentes nos sinais vencedores.
          - Diferencas entre sinais vencedores e perdedores.

          Nao trate sinais em aberto como perdas.
          Nao confunda registros hipoteticos com resultados reais.
          Nao tire conclusoes fortes de amostras pequenas.
          Nao invente taxas de acerto ou estatisticas.

          Use o historico para melhorar a interpretacao
          do mercado atual, mas nao altere automaticamente
          os parametros, os pesos ou as regras do motor.

          Se os dados permitirem uma direcao defensavel,
          escolha COMPRA ou VENDA. Caso contrario, SEM_SINAL.

          A confianca deve representar a avaliacao da IA,
          entre 0 e 100. Ela nao e uma probabilidade estatistica
          comprovada de acerto.

          Responda somente JSON valido:
          {
            "decisao": "SEM_SINAL",
            "confianca": 0,
            "justificativa": "Motivo tecnico objetivo"
          }

          DADOS TECNICOS ATUAIS:
          """ + json.dumps(analise, ensure_ascii=False) + """

          MEMORIA HISTORICA E RESULTADOS:
          """ + json.dumps(memoria, ensure_ascii=False)

          corpo = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 400,
                  "responseMimeType": "application/json"
              }
          }

          pedido = urllib.request.Request(
              BASE + "/" + modelo + ":generateContent",
              data=json.dumps(corpo).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": chave
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(pedido, timeout=45) as resp:
                  resposta = json.loads(resp.read().decode("utf-8"))

              texto = resposta["candidates"][0]["content"]["parts"][0]["text"]
              decisao = json.loads(texto)

          except urllib.error.HTTPError as e:
              detalhe = e.read().decode("utf-8", "replace")
              print("Erro HTTP do Gemini:", e.code)
              print(detalhe[:1500])
              sys.exit(1)

          except Exception as e:
              sys.exit("Falha ao interpretar a resposta Gemini: " + str(e))

          lado_ia = decisao.get("decisao")

          if lado_ia not in ("COMPRA", "VENDA", "SEM_SINAL"):
              sys.exit("Decisao da IA invalida.")

          try:
              confianca = int(decisao.get("confianca", 0))
          except (ValueError, TypeError):
              sys.exit("Confianca invalida.")

          if not 0 <= confianca <= 100:
              sys.exit("Confianca fora do intervalo 0 a 100.")

          def numero_seguro(valor):
              try:
                  valor = float(valor)
                  if valor != valor or abs(valor) == float("inf"):
                      return None
                  return valor
              except (ValueError, TypeError):
                  return None

          def pontuacao_tecnica(lado):
              chave_nova = (
                  "pontuacao_tecnica_compra"
                  if lado == "COMPRA"
                  else "pontuacao_tecnica_venda"
              )

              valor = numero_seguro(analise.get(chave_nova))

              if valor is not None:
                  return max(0.0, min(75.0, valor)), "campo_tecnico_75"

              chave_antiga = (
                  "pontuacao_compra"
                  if lado == "COMPRA"
                  else "pontuacao_venda"
              )

              valor = numero_seguro(analise.get(chave_antiga))

              if valor is not None:
                  return max(0.0, min(75.0, valor * 75.0 / 6.0)), "campo_antigo_normalizado"

              return None, "pontuacao_tecnica_ausente"

          tecnico_compra, fonte_compra = pontuacao_tecnica("COMPRA")
          tecnico_venda, fonte_venda = pontuacao_tecnica("VENDA")

          contribuicao_ia = confianca * 0.25

          if lado_ia == "COMPRA":
              tecnico_lado = tecnico_compra
              fonte_lado = fonte_compra
          elif lado_ia == "VENDA":
              tecnico_lado = tecnico_venda
              fonte_lado = fonte_venda
          else:
              tecnico_lado = None
              fonte_lado = "sem_direcao_da_ia"

          if lado_ia == "SEM_SINAL" or tecnico_lado is None:
              pontuacao_final = None
              lado_final = "SEM_SINAL"
          else:
              pontuacao_final = round(
                  tecnico_lado + contribuicao_ia, 2
              )

              if pontuacao_final >= 40:
                  lado_final = lado_ia
              else:
                  lado_final = "SEM_SINAL"

          resultado = {
              "ativo": "XAUUSD",
              "timeframe": "M5",
              "candle_utc": analise.get("candle_utc"),
              "decisao_motor": analise.get("decisao"),
              "modelo_utilizado": modelo,
              "decisao_ia_original": lado_ia,
              "decisao_gemini": lado_final,
              "confianca_declarada": confianca,
              "pontuacao_tecnica_compra": tecnico_compra,
              "pontuacao_tecnica_venda": tecnico_venda,
              "fonte_pontuacao_tecnica": fonte_lado,
              "pontuacao_tecnica_direcao": tecnico_lado,
              "contribuicao_gemini": round(contribuicao_ia, 2),
              "pontuacao_final": pontuacao_final,
              "limiar_final": 40,
              "peso_tecnico_maximo": 75,
              "peso_gemini_maximo": 25,
              "justificativa": str(
                  decisao.get("justificativa", "")
              )[:1200],
              "gerado_utc": datetime.now(timezone.utc).isoformat(),
              "modo_teste": True,
              "envio_telegram": False,
              "execucao_ordens": False
          }

          Path("data/decisao_gemini.json").write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(resultado, ensure_ascii=False, indent=2))
          PY

      - name: Calcular entrada stop e alvo pelo ATR
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          csv_path = Path("data/candles/xauusd_m5_fechados.csv")
          json_path = Path("data/decisao_gemini.json")

          decisao = json.loads(json_path.read_text(encoding="utf-8"))

          if decisao.get("decisao_gemini") not in ("COMPRA", "VENDA"):
              print("SEM_SINAL: calculo de entrada dispensado.")
              raise SystemExit(0)

          with csv_path.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)

              if not reader.fieldnames:
                  raise SystemExit("CSV sem cabecalho.")

              def normalizar(nome):
                  return "".join(
                      c.lower() for c in nome.strip() if c.isalnum()
                  )

              colunas = {
                  normalizar(nome): nome for nome in reader.fieldnames
              }

              def encontrar(*nomes):
                  for nome in nomes:
                      if normalizar(nome) in colunas:
                          return colunas[normalizar(nome)]
                  raise SystemExit(
                      "Coluna ausente no CSV: " + ", ".join(nomes)
                  )

              col_high = encontrar("high", "max", "maximum")
              col_low = encontrar("low", "min", "minimum")
              col_close = encontrar("close", "fechamento", "last")
              linhas = list(reader)

          if len(linhas) < 15:
              raise SystemExit("Sao necessarios pelo menos 15 candles.")

          def numero(linha, coluna):
              valor = float(linha[coluna])
              if not math.isfinite(valor):
                  raise ValueError("Preco invalido no CSV.")
              return valor

          candles = [
              {
                  "high": numero(l, col_high),
                  "low": numero(l, col_low),
                  "close": numero(l, col_close)
              }
              for l in linhas
          ]

          ultimos = candles[-15:]
          true_ranges = []

          for i in range(1, len(ultimos)):
              atual = ultimos[i]
              anterior = ultimos[i - 1]["close"]

              true_ranges.append(max(
                  atual["high"] - atual["low"],
                  abs(atual["high"] - anterior),
                  abs(atual["low"] - anterior)
              ))

          atr14 = sum(true_ranges[-14:]) / 14
          entrada = candles[-1]["close"]
          lado = decisao["decisao_gemini"]

          if atr14 <= 0 or not math.isfinite(atr14):
              raise SystemExit("ATR invalido.")

          distancia_stop = atr14 * 1.5
          distancia_alvo = distancia_stop * 1.5

          if lado == "COMPRA":
              stop = entrada - distancia_stop
              alvo = entrada + distancia_alvo
          else:
              stop = entrada + distancia_stop
              alvo = entrada - distancia_alvo

          decisao.update({
              "entrada": round(entrada, 3),
              "atr14": round(atr14, 5),
              "distancia_stop": round(distancia_stop, 3),
              "stop_loss": round(stop, 3),
              "take_profit": round(alvo, 3),
              "distancia_alvo": round(distancia_alvo, 3),
              "relacao_risco_retorno": "1:1.5",
              "metodo_entrada": "Fechamento do ultimo candle",
              "metodo_stop": "ATR(14) x 1,5",
              "metodo_alvo": "Distancia do stop x 1,5"
          })

          json_path.write_text(
              json.dumps(decisao, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Entrada, stop e alvo calculados.")
          print(json.dumps({
              "decisao": lado,
              "entrada": decisao["entrada"],
              "stop_loss": decisao["stop_loss"],
              "take_profit": decisao["take_profit"],
              "pontuacao_final": decisao["pontuacao_final"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verificar sinal repetido
        id: duplicidade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/historico_anterior

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Agente Gemini XAUUSD" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name historico-agente-gemini \
              --dir data/historico_anterior || true
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          atual = json.loads(
              Path("data/decisao_gemini.json").read_text(encoding="utf-8")
          )

          arquivo = Path("data/historico_anterior/historico_sinais.json")
          historico = []

          if arquivo.exists():
              try:
                  historico = json.loads(arquivo.read_text(encoding="utf-8"))
                  if not isinstance(historico, list):
                      historico = []
              except Exception:
                  historico = []

          lado = atual.get("decisao_gemini")
          candle = atual.get("candle_utc")

          duplicado = False

          if lado in ("COMPRA", "VENDA") and candle:
              duplicado = any(
                  item.get("candle_utc") == candle
                  and item.get("decisao_gemini") == lado
                  and item.get("envio_telegram") is True
                  for item in historico
                  if isinstance(item, dict)
              )

          with open(Path("data/duplicidade.json"), "w", encoding="utf-8") as f:
              json.dump({"duplicado": duplicado}, f)

          print("Sinal repetido:", duplicado)
          PY

          DUPLICADO=$(python -c "import json; print(str(json.load(open('data/duplicidade.json'))['duplicado']).lower())")
          echo "duplicado=$DUPLICADO" >> "$GITHUB_OUTPUT"

      - name: Enviar sinal para o Telegram
        if: steps.duplicidade.outputs.duplicado != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          FUSO_SP = ZoneInfo("America/Sao_Paulo")

          arquivo = Path("data/decisao_gemini.json")
          decisao = json.loads(arquivo.read_text(encoding="utf-8"))

          lado = decisao.get("decisao_gemini", "SEM_SINAL")

          if lado not in ("COMPRA", "VENDA"):
              print("SEM_SINAL: nenhuma mensagem enviada.")
              raise SystemExit(0)

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              sys.exit("Configure os Secrets do Telegram no GitHub.")

          campos = (
              "entrada", "stop_loss", "take_profit",
              "distancia_stop", "pontuacao_final"
          )

          if any(decisao.get(campo) is None for campo in campos):
              sys.exit("Dados obrigatorios ausentes. Mensagem nao enviada.")

          confianca = decisao.get("confianca_declarada", 0)
          entrada = decisao["entrada"]
          stop = decisao["stop_loss"]
          alvo = decisao["take_profit"]
          distancia = decisao["distancia_stop"]
          pontos = decisao["pontuacao_final"]
          candle = decisao.get("candle_utc") or "Nao informado"
          justificativa = str(decisao.get("justificativa", ""))[:700]

          horario_sinal_utc = datetime.now(timezone.utc)

          try:
              abertura_utc = datetime.fromisoformat(
                  str(candle).replace("Z", "+00:00")
              )

              if abertura_utc.tzinfo is None:
                  abertura_utc = abertura_utc.replace(
                      tzinfo=timezone.utc
                  )
              else:
                  abertura_utc = abertura_utc.astimezone(timezone.utc)

              fechamento_utc = abertura_utc + timedelta(minutes=5)

              atraso_minutos = (
                  horario_sinal_utc - fechamento_utc
              ).total_seconds() / 60

              fechamento_sp = fechamento_utc.astimezone(FUSO_SP)
              sinal_sp = horario_sinal_utc.astimezone(FUSO_SP)

              fechamento_texto = fechamento_sp.strftime("%H:%M:%S")
              sinal_texto = sinal_sp.strftime("%H:%M:%S")
              atraso_texto = f"{atraso_minutos:.1f} min"

          except (ValueError, TypeError, OverflowError):
              fechamento_utc = None
              atraso_minutos = None
              fechamento_texto = "Nao calculado"
              sinal_texto = horario_sinal_utc.astimezone(
                  FUSO_SP
              ).strftime("%H:%M:%S")
              atraso_texto = "Nao calculado"

              print(
                  "Aviso: nao foi possivel interpretar "
                  "o horario do candle:",
                  candle
              )

          emoji = "🟢" if lado == "COMPRA" else "🔴"

          mensagem = (
              f"🥇 <b>XAUUSD · OURO</b>\n"
              f"⏱ Timeframe: M5\n\n"
              f"{emoji} <b>{lado}</b>\n\n"
              f"💰 Entrada: <code>{entrada:.3f}</code>\n"
              f"🛑 Stop-loss: <code>{stop:.3f}</code>\n"
              f"🎯 Alvo: <code>{alvo:.3f}</code>\n"
              f"📏 Distância do stop: <code>{distancia:.3f}</code>\n"
              f"📐 Risco-retorno: <b>1:1,5</b>\n"
              f"📊 Pontuação final: <b>{pontos}/100</b>\n"
              f"🧠 Confiança declarada pela IA: <b>{confianca}%</b>\n\n"
              f"📝 {justificativa}\n\n"
              f"🕯️ Abertura do candle UTC: {candle}\n"
              f"🔔 Fechamento do candle (Brasília): {fechamento_texto}\n"
              f"📨 Horário do sinal (Brasília): {sinal_texto}\n"
              f"⏱️ Atraso após fechamento: {atraso_texto}\n"
              f"⚠️ Sinal experimental. Não é garantia de lucro."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          dados = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": mensagem,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true"
          }).encode("utf-8")

          pedido = urllib.request.Request(
              url,
              data=dados,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(pedido, timeout=20) as resposta:
                  retorno = json.loads(
                      resposta.read().decode("utf-8")
                  )

              if not retorno.get("ok"):
                  sys.exit("Telegram nao confirmou o envio.")

              decisao["envio_telegram"] = True
              decisao["fechamento_candle_utc"] = (
                  fechamento_utc.isoformat()
                  if fechamento_utc is not None
                  else None
              )
              decisao["horario_sinal_utc"] = (
                  horario_sinal_utc.isoformat()
              )
              decisao["atraso_apos_fechamento_minutos"] = (
                  round(atraso_minutos, 2)
                  if atraso_minutos is not None
                  else None
              )

              arquivo.write_text(
                  json.dumps(decisao, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              print("Mensagem enviada ao Telegram.")
              print("Fechamento (Brasilia):", fechamento_texto)
              print("Horario do sinal (Brasilia):", sinal_texto)
              print("Atraso apos fechamento:", atraso_texto)

          except Exception as erro:
              sys.exit(f"Falha no envio ao Telegram: {erro}")
          PY

      - name: Registrar decisao no historico
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          atual_path = Path("data/decisao_gemini.json")
          historico_path = Path("data/historico_sinais.json")
          anterior_path = Path(
              "data/historico_anterior/historico_sinais.json"
          )

          historico = []

          if anterior_path.exists():
              try:
                  historico = json.loads(
                      anterior_path.read_text(encoding="utf-8")
                  )
                  if not isinstance(historico, list):
                      historico = []
              except Exception:
                  historico = []

          if atual_path.exists():
              try:
                  atual = json.loads(
                      atual_path.read_text(encoding="utf-8")
                  )
                  historico.append(atual)
              except Exception as erro:
                  print("Nao foi possivel registrar decisao:", erro)

          historico = historico[-500:]

          historico_path.parent.mkdir(parents=True, exist_ok=True)
          historico_path.write_text(
              json.dumps(historico, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Historico preparado. Registros:", len(historico))
          PY

