
name: Agente Gemini XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: agente-gemini-xau
  cancel-in-progress: false

jobs:
  agente:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Localizar ultima selecao bem-sucedida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma execucao bem-sucedida do testador foi encontrada."
            exit 1
          fi

          mkdir -p data

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name selecao-modelo-gemini \
            --dir data

          if [ ! -f data/modelo_gemini.json ]; then
            echo "::error::Arquivo de selecao nao encontrado."
            exit 1
          fi

      - name: Receber candles para entrada e ATR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Integracao XAUUSD Bot V2" \
            --status success \
            --limit 30 \
            --json databaseId,headSha,createdAt \
            --jq "map(select(.headSha == \"$UPSTREAM_SHA\")) | sort_by(.createdAt) | last | .databaseId // empty")

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma integracao bem-sucedida encontrada para este commit."
            exit 1
          fi

          mkdir -p data/candles

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name candles-xauusd-m5 \
            --dir data/candles

          if [ ! -f data/candles/xauusd_m5_fechados.csv ]; then
            echo "::error::CSV de candles fechados nao encontrado."
            exit 1
          fi

          echo "Candles recebidos para calcular entrada e stop."

      - name: Validar arquivos recebidos
        run: |
          test -f data/analise_tecnica_contexto.json || {
            echo "::error::Analise tecnica ausente."
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path

          analise = json.loads(
              Path("data/analise_tecnica_contexto.json").read_text(
                  encoding="utf-8"
              )
          )

          selecao = json.loads(
              Path("data/modelo_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          if selecao.get("status") != "pronto":
              raise SystemExit("A selecao de modelo nao esta pronta.")

          modelo = selecao.get("modelo_escolhido", "")

          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("Nome de modelo invalido.")

          if not isinstance(analise, dict) or not analise:
              raise SystemExit("Analise tecnica vazia ou invalida.")

          print("Analise tecnica validada.")
          print("Modelo selecionado:", modelo)
          PY

      - name: Agente interpreta o mercado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          BASE = "https://generativelanguage.googleapis.com/v1beta"

          with open(
              "data/analise_tecnica_contexto.json",
              encoding="utf-8"
          ) as f:
              analise = json.load(f)

          with open(
              "data/modelo_gemini.json",
              encoding="utf-8"
          ) as f:
              selecao = json.load(f)

          chave = os.getenv("GEMINI_API_KEY", "").strip()
          modelo = selecao.get("modelo_escolhido")

          if not chave:
              sys.exit("Secret GEMINI_API_KEY ausente.")

          if selecao.get("status") != "pronto" or not modelo:
              sys.exit("Nenhum modelo validado. Nenhum sinal gerado.")

          prompt = """
          Voce e um analista tecnico proativo de XAUUSD M5.

          OBJETIVO:
          Encontrar oportunidades de COMPRA e VENDA mais cedo,
          sem exigir alinhamento perfeito entre M5, M15 e H1.
          Use exclusivamente os dados tecnicos fornecidos.
          Nunca invente precos, indicadores ou noticias.

          REGRAS:
          1. Avalie tendencias M5, M15 e H1, RSI, ATR,
             impulso, rompimento e possivel esgotamento.
          2. Considere continuacao de tendencia e reversoes.
          3. Pontuacao minima do motor: 3.
          4. Diferenca minima entre direcoes: 1.
          5. Nao exija alinhamento perfeito dos tres tempos.
          6. Divergencias leves nao eliminam automaticamente
             uma oportunidade; conflitos fortes reduzem
             a confianca e podem justificar SEM_SINAL.
          7. Procure sinais iniciais de perda de forca
             e de tentativa de reversao.
          8. Evite entradas muito atrasadas depois de
             movimentos esticados ou ja muito avancados.
          9. Se houver evidencia direcional razoavel,
             escolha COMPRA ou VENDA.
          10. Escolha SEM_SINAL se os dados forem insuficientes,
              contraditorios demais ou sem direcao defensavel.
          11. Nao invente preco de entrada, stop ou alvo.
          12. Nao execute nem solicite ordens.
          13. A confianca e uma avaliacao da IA, nao uma
              probabilidade estatistica comprovada de acerto.
          14. Nao gere sinais apenas para aumentar a frequencia.
          15. Nao apresente uma oportunidade como garantia de lucro.

          Responda somente JSON valido:
          {
            "decisao": "SEM_SINAL",
            "confianca": 0,
            "justificativa": "Motivo tecnico objetivo"
          }

          DADOS TECNICOS:
          """ + json.dumps(analise, ensure_ascii=False)

          corpo = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 400,
                  "responseMimeType": "application/json"
              }
          }

          url = BASE + "/" + modelo + ":generateContent"

          pedido = urllib.request.Request(
              url,
              data=json.dumps(corpo).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": chave
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(pedido, timeout=40) as resp:
                  resposta = json.loads(
                      resp.read().decode("utf-8")
                  )

              texto = resposta["candidates"][0]["content"]["parts"][0]["text"]
              decisao = json.loads(texto)

          except urllib.error.HTTPError as e:
              detalhe = e.read().decode("utf-8", "replace")
              print("Erro HTTP do Gemini:", e.code)
              print(detalhe[:1200])
              sys.exit(1)

          except Exception as e:
              print("Erro na resposta do agente:", str(e))
              sys.exit(1)

          lado = decisao.get("decisao")

          if lado not in ("COMPRA", "VENDA", "SEM_SINAL"):
              sys.exit("Resposta da IA contem decisao invalida.")

          try:
              confianca = int(decisao.get("confianca", 0))
          except (ValueError, TypeError):
              sys.exit("Confianca invalida.")

          if not 0 <= confianca <= 100:
              sys.exit("Confianca fora do intervalo de 0 a 100.")

          resultado = {
              "ativo": "XAUUSD",
              "timeframe": "M5",
              "candle_utc": analise.get("candle_utc"),
              "decisao_motor": analise.get("decisao"),
              "modelo_utilizado": modelo,
              "decisao_gemini": lado,
              "confianca_declarada": confianca,
              "justificativa": str(
                  decisao.get("justificativa", "")
              )[:1200],
              "gerado_utc": datetime.now(timezone.utc).isoformat(),
              "modo_teste": True,
              "envio_telegram": False,
              "execucao_ordens": False
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/decisao_gemini.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(resultado, ensure_ascii=False, indent=2))
          print("Analise do agente concluida.")
          PY

      - name: Calcular entrada e stop pelo ATR
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          csv_path = Path("data/candles/xauusd_m5_fechados.csv")
          json_path = Path("data/decisao_gemini.json")

          decisao = json.loads(
              json_path.read_text(encoding="utf-8")
          )

          if decisao.get("decisao_gemini") not in ("COMPRA", "VENDA"):
              print("SEM_SINAL: calculo de entrada dispensado.")
              raise SystemExit(0)

          with csv_path.open(
              encoding="utf-8-sig",
              newline=""
          ) as f:
              reader = csv.DictReader(f)

              if not reader.fieldnames:
                  raise SystemExit("CSV sem cabecalho.")

              def normalizar(nome):
                  return "".join(
                      c.lower() for c in nome.strip()
                      if c.isalnum()
                  )

              colunas = {
                  normalizar(nome): nome
                  for nome in reader.fieldnames
              }

              def encontrar(*nomes):
                  for nome in nomes:
                      chave = normalizar(nome)
                      if chave in colunas:
                          return colunas[chave]

                  raise SystemExit(
                      "Coluna necessaria ausente no CSV: "
                      + ", ".join(nomes)
                      + ". Confira o cabecalho do arquivo."
                  )

              col_high = encontrar("high", "max", "maximum")
              col_low = encontrar("low", "min", "minimum")
              col_close = encontrar("close", "fechamento", "last")

              linhas = list(reader)

          if len(linhas) < 15:
              raise SystemExit(
                  "Sao necessarios pelo menos 15 candles."
              )

          def numero(linha, coluna):
              valor = float(linha[coluna])

              if not math.isfinite(valor):
                  raise ValueError("Preco invalido no CSV.")

              return valor

          candles = []

          for linha in linhas:
              candles.append({
                  "high": numero(linha, col_high),
                  "low": numero(linha, col_low),
                  "close": numero(linha, col_close)
              })

          ultimos = candles[-15:]
          true_ranges = []

          for i in range(1, len(ultimos)):
              atual = ultimos[i]
              fechamento_anterior = ultimos[i - 1]["close"]

              tr = max(
                  atual["high"] - atual["low"],
                  abs(atual["high"] - fechamento_anterior),
                  abs(atual["low"] - fechamento_anterior)
              )

              true_ranges.append(tr)

          atr14 = sum(true_ranges[-14:]) / 14
          entrada = candles[-1]["close"]
          lado = decisao["decisao_gemini"]

          if atr14 <= 0:
              raise SystemExit("ATR invalido ou igual a zero.")

          distancia = atr14 * 1.5

          if lado == "COMPRA":
              stop = entrada - distancia
          else:
              stop = entrada + distancia

          decisao["entrada"] = round(entrada, 3)
          decisao["atr14"] = round(atr14, 5)
          decisao["distancia_stop"] = round(distancia, 3)
          decisao["stop_loss"] = round(stop, 3)
          decisao["metodo_entrada"] = "Fechamento do ultimo candle"
          decisao["metodo_stop"] = "ATR(14) x 1,5"

          json_path.write_text(
              json.dumps(
                  decisao,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Entrada e stop calculados.")
          print(json.dumps({
              "decisao": lado,
              "entrada": decisao["entrada"],
              "atr14": decisao["atr14"],
              "distancia_stop": decisao["distancia_stop"],
              "stop_loss": decisao["stop_loss"]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Enviar sinal para o Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import urllib.request
          import urllib.parse
          from pathlib import Path

          arquivo = Path("data/decisao_gemini.json")
          decisao = json.loads(
              arquivo.read_text(encoding="utf-8")
          )

          lado = decisao.get("decisao_gemini", "SEM_SINAL")

          if lado not in ("COMPRA", "VENDA"):
              print("SEM_SINAL: nenhuma mensagem enviada.")
              sys.exit(0)

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              sys.exit("Configure os Secrets do Telegram no GitHub.")

          campos = ("entrada", "stop_loss", "distancia_stop")

          if any(decisao.get(campo) is None for campo in campos):
              sys.exit(
                  "Entrada ou stop ausente. Mensagem nao enviada."
              )

          confianca = decisao.get("confianca_declarada", 0)
          entrada = decisao["entrada"]
          stop = decisao["stop_loss"]
          distancia = decisao["distancia_stop"]
          candle = decisao.get("candle_utc") or "Nao informado"

          emoji = "🟢" if lado == "COMPRA" else "🔴"

          mensagem = (
              f"🥇 <b>XAUUSD · OURO</b>\n"
              f"⏱ Timeframe: M5\n\n"
              f"{emoji} <b>{lado}</b>\n\n"
              f"💰 Entrada: <code>{entrada:.3f}</code>\n"
              f"🛑 Stop-loss: <code>{stop:.3f}</code>\n"
              f"📏 Distância do stop: <code>{distancia:.3f}</code>\n"
              f"📐 Método: ATR(14) × 1,5\n"
              f"🧠 Confiança: <b>{confianca}%</b>\n\n"
              f"🕒 Candle UTC: {candle}"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          dados = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": mensagem,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true"
          }).encode("utf-8")

          pedido = urllib.request.Request(
              url,
              data=dados,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(pedido, timeout=20) as resposta:
                  retorno = json.loads(
                      resposta.read().decode("utf-8")
                  )

              if not retorno.get("ok"):
                  sys.exit("Telegram nao confirmou o envio.")

              decisao["envio_telegram"] = True

              arquivo.write_text(
                  json.dumps(
                      decisao,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print("Mensagem Gemini enviada ao Telegram.")

          except Exception as erro:
              sys.exit(f"Falha no envio ao Telegram: {erro}")
          PY

      - name: Guardar decisao do agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-agente-gemini
          path: data/decisao_gemini.json
          if-no-files-found: ignore
          retention-days: 7
