
name: Agente Gemini XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: agente-gemini-xau
  cancel-in-progress: false

jobs:
  agente:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Localizar ultima selecao bem-sucedida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma execucao bem-sucedida do testador foi encontrada."
            echo "Execute primeiro o workflow Testador e Seletor Gemini."
            exit 1
          fi

          echo "Execucao do testador selecionada: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name selecao-modelo-gemini \
            --dir data

          if [ ! -f data/modelo_gemini.json ]; then
            echo "::error::O arquivo de selecao do modelo nao foi encontrado."
            exit 1
          fi

      - name: Validar arquivos recebidos
        run: |
          test -f data/analise_tecnica_contexto.json || {
            echo "::error::Analise tecnica ausente."
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path

          analise = json.loads(
              Path("data/analise_tecnica_contexto.json").read_text(
                  encoding="utf-8"
              )
          )
          selecao = json.loads(
              Path("data/modelo_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          if selecao.get("status") != "pronto":
              raise SystemExit("A selecao de modelo nao esta pronta.")

          modelo = selecao.get("modelo_escolhido", "")
          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("Nome de modelo invalido.")

          if not isinstance(analise, dict) or not analise:
              raise SystemExit("Analise tecnica vazia ou invalida.")

          print("Analise tecnica validada.")
          print("Modelo selecionado:", modelo)
          PY

      - name: Agente interpreta o mercado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          BASE = "https://generativelanguage.googleapis.com/v1beta"

          with open(
              "data/analise_tecnica_contexto.json",
              encoding="utf-8"
          ) as f:
              analise = json.load(f)

          with open(
              "data/modelo_gemini.json",
              encoding="utf-8"
          ) as f:
              selecao = json.load(f)

          chave = os.getenv("GEMINI_API_KEY", "").strip()
          modelo = selecao.get("modelo_escolhido")

          if not chave:
              sys.exit("Secret GEMINI_API_KEY ausente.")

          if selecao.get("status") != "pronto" or not modelo:
              sys.exit("Nenhum modelo validado. Nenhum sinal gerado.")

          prompt = """
          Voce e um analista tecnico experimental de XAUUSD M5.

          Use somente os dados fornecidos. Nao invente cotacoes,
          indicadores, noticias ou acontecimentos externos.

          Avalie:
          - Tendencias M5, M15 e H1.
          - RSI, ATR e pontuacoes do motor tecnico.
          - Impulso, esgotamento e possivel reversao.
          - Concordancia entre timeframes.
          - Risco de entrada atrasada e insuficiencia de evidencias.

          A decisao deve ser COMPRA, VENDA ou SEM_SINAL.
          Seja conservador quando os sinais forem conflitantes.
          Nao trate a confianca como probabilidade estatistica validada.
          Nao solicite nem execute ordens.

          Responda somente JSON:
          {
            "decisao": "SEM_SINAL",
            "confianca": 0,
            "justificativa": "Motivo tecnico objetivo"
          }

          DADOS TECNICOS:
          """ + json.dumps(analise, ensure_ascii=False)

          corpo = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }],
              "generationConfig": {
                  "temperature": 0.1,
                  "maxOutputTokens": 400,
                  "responseMimeType": "application/json"
              }
          }

          url = BASE + "/" + modelo + ":generateContent"

          pedido = urllib.request.Request(
              url,
              data=json.dumps(corpo).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": chave
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(pedido, timeout=40) as resp:
                  resposta = json.loads(
                      resp.read().decode("utf-8")
                  )

              texto = resposta["candidates"][0]["content"]["parts"][0]["text"]
              decisao = json.loads(texto)

          except urllib.error.HTTPError as e:
              detalhe = e.read().decode("utf-8", "replace")
              print("Erro HTTP do Gemini:", e.code)
              print(detalhe[:1200])
              sys.exit(1)

          except Exception as e:
              print("Erro na resposta do agente:", str(e))
              sys.exit(1)

          lado = decisao.get("decisao")
          if lado not in ("COMPRA", "VENDA", "SEM_SINAL"):
              sys.exit("Resposta da IA contem decisao invalida.")

          try:
              confianca = int(decisao.get("confianca", 0))
          except (ValueError, TypeError):
              sys.exit("Confianca invalida.")

          if not 0 <= confianca <= 100:
              sys.exit("Confianca fora do intervalo de 0 a 100.")

          resultado = {
              "ativo": "XAUUSD",
              "timeframe": "M5",
              "candle_utc": analise.get("candle_utc"),
              "decisao_motor": analise.get("decisao"),
              "modelo_utilizado": modelo,
              "decisao_gemini": lado,
              "confianca_declarada": confianca,
              "justificativa": str(
                  decisao.get("justificativa", "")
              )[:1200],
              "gerado_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "modo_teste": True,
              "envio_telegram": False,
              "execucao_ordens": False
          }

          os.makedirs("data", exist_ok=True)
          with open(
              "data/decisao_gemini.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(resultado, f, ensure_ascii=False, indent=2)

          
      - name: Enviar sinal para o Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          import urllib.request
          import urllib.parse
          from pathlib import Path

          arquivo = Path("data/decisao_gemini.json")
          decisao = json.loads(arquivo.read_text(encoding="utf-8"))

          lado = decisao.get("decisao_gemini", "SEM_SINAL")
          if lado not in ("COMPRA", "VENDA"):
              print("SEM_SINAL: nenhuma mensagem enviada.")
              sys.exit(0)

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              sys.exit("Configure TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID nos Secrets.")

          confianca = decisao.get("confianca_declarada", "Não informada")
          justificativa = str(decisao.get("justificativa", "Sem justificativa."))[:1000]
          candle = decisao.get("candle_utc") or decisao.get("gerado_utc", "Não informado")

          emoji = "🟢" if lado == "COMPRA" else "🔴"

          mensagem = (
              f"🥇 <b>XAUUSD · OURO</b>\n"
              f"⏱ Timeframe: M5\n\n"
              f"{emoji} <b>{lado}</b>\n\n"
              f"🧠 <b>Confiança do agente: {confianca}%</b>\n\n"
              f"📊 <b>Análise técnica</b>\n{justificativa}\n\n"
              f"🕒 Candle UTC: {candle}\n\n"
              "ℹ️ Confiança declarada pela IA; não é probabilidade comprovada de lucro.\n"
              "Alerta informativo. Não executa ordens."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          dados = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": mensagem,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true"
          }).encode("utf-8")

          pedido = urllib.request.Request(url, data=dados, method="POST")
          try:
              with urllib.request.urlopen(pedido, timeout=20) as resposta:
                  resultado = json.loads(resposta.read().decode("utf-8"))
              if not resultado.get("ok"):
                  sys.exit("Telegram não confirmou o envio.")
              print("Mensagem enviada ao Telegram.")
          except Exception as erro:
              sys.exit(f"Falha no envio ao Telegram: {erro}")
          PY

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-agente-gemini
          path: data/decisao_gemini.json
          if-no-files-found: ignore
          retention-days: 7
