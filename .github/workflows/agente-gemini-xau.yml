name: Agente Gemini XAUUSD

on:
  workflow_run:
    workflows:
      - "Analise Tecnica Contexto"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: agente-gemini-xau
  cancel-in-progress: false

jobs:
  agente:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Receber analise tecnica
        uses: actions/download-artifact@v4
        with:
          name: analise-tecnica-xau
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Localizar ultima selecao bem-sucedida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow testador-gemini.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Nenhuma execucao bem-sucedida do testador foi encontrada."
            echo "Execute primeiro o workflow Testador e Seletor Gemini."
            exit 1
          fi

          echo "Execucao do testador selecionada: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name selecao-modelo-gemini \
            --dir data

          if [ ! -f data/modelo_gemini.json ]; then
            echo "::error::Arquivo de selecao nao encontrado."
            exit 1
          fi

      - name: Validar arquivos recebidos
        run: |
          test -f data/analise_tecnica_contexto.json || {
            echo "::error::Analise tecnica ausente."
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path

          analise = json.loads(
              Path("data/analise_tecnica_contexto.json").read_text(
                  encoding="utf-8"
              )
          )
          selecao = json.loads(
              Path("data/modelo_gemini.json").read_text(
                  encoding="utf-8"
              )
          )

          if selecao.get("status") != "pronto":
              raise SystemExit("A selecao de modelo nao esta pronta.")

          modelo = selecao.get("modelo_escolhido", "")
          if not isinstance(modelo, str) or not modelo.startswith("models/gemini-"):
              raise SystemExit("Nome de modelo invalido.")

          if not isinstance(analise, dict) or not analise:
              raise SystemExit("Analise tecnica vazia ou invalida.")

          print("Analise tecnica validada.")
          print("Modelo selecionado:", modelo)
          PY

      - name: Agente interpreta o mercado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          # URL BASE CORRIGIDA AQUI:
          BASE = "https://googleapis.com"

          with open("data/analise_tecnica_contexto.json", encoding="utf-8") as f:
              analise = json.load(f)

          with open("data/modelo_gemini.json", encoding="utf-8") as f:
              selecao = json.load(f)

          chave = os.getenv("GEMINI_API_KEY", "").strip()
          modelo = selecao.get("modelo_escolhido")

          if not chave:
              sys.exit("::error::Secret GEMINI_API_KEY ausente.")

          if selecao.get("status") != "pronto" or not modelo:
              sys.exit("::error::Nenhum modelo validado. Nenhum sinal gerado.")

          prompt_texto = f"""
          Voce e um analista tecnico proativo de XAUUSD M5.
          Seu estilo e ARROJADO, mas disciplinado.

          OBJETIVO:
          Identificar oportunidades iniciais de COMPRA e VENDA,
          sem esperar confirmacao perfeita entre M5, M15 e H1.

          DADOS TECNICOS ATUAIS DO MERCADO:
          {json.dumps(analise, indent=2, ensure_ascii=False)}

          REGRAS DE DECISAO:
          1. Avalie tendencias M5, M15 e H1, RSI, ATR, impulso, rompimento, esgotamento e reversao.
          2. Considere continuacao de tendencia e reversoes iniciais.
          3. O motor usa pontuacao minima 3 e diferenca minima 1.
          4. Nao exija alinhamento perfeito entre os tres tempos.
          5. Divergencia leve nao elimina automaticamente um sinal.
          6. Conflitos fortes entre evidencias reduzem a confianca.
          7. Procure perda de forca da tendencia anterior e sinais iniciais de movimento.

          FORMATO DE RETORNO OBRIGATORIO:
          Sua resposta deve ser EXCLUSIVAMENTE um objeto JSON valido, contendo:
          {{
            "decisao": "COMPRA" ou "VENDA" ou "SEM SINAL",
            "justificativa": "Texto curto explicando os fatores tecnicos levados em conta"
          }}
          """

          payload = {
              "contents": [{
                  "parts": [{"text": prompt_texto}]
              }],
              "generationConfig": {
                  "responseMimeType": "application/json"
              }
          }

          url = f"{BASE}/{modelo}:generateContent?key={chave}"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              print(f"Enviando analise para o modelo {modelo}...")
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  
              texto_resposta = res_data["candidates"][0]["content"]["parts"][0]["text"]
              decisao_json = json.loads(texto_resposta.strip())
              
              os.makedirs("data", exist_ok=True)
              with open("data/decisao_agente.json", "w", encoding="utf-8") as f:
                  json.dump(decisao_json, f, indent=2, ensure_ascii=False)
                  
              print("Decisao do Agente gerada com sucesso:")
              print(json.dumps(decisao_json, indent=2, ensure_ascii=False))

          except urllib.error.HTTPError as e:
              print(f"::error::Erro na API Gemini: {e.code} - {e.read().decode('utf-8')}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Falha ao processar resposta do Agente: {str(e)}")
              sys.exit(1)
          PY
