
name: Salvar Historico Velas XAUUSD M5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salvar-historico-velas-xauusd
  cancel-in-progress: false

jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Salvar historico de velas
        run: |
          set -e

          if [ ! -f data/historico_velas_m5.csv ]; then
            echo "Arquivo data/historico_velas_m5.csv nao encontrado."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/historico_velas_m5.csv

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no historico."
            exit 0
          fi

          git commit -m "Atualiza historico de velas XAUUSD M5"

          BRANCH="${{ github.event.repository.default_branch }}"

          for tentativa in 1 2 3; do
            git fetch origin "$BRANCH"

            if ! git rebase "origin/$BRANCH"; then
              echo "Conflito detectado. Interrompendo para proteger o historico."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:$BRANCH"; then
              echo "Historico salvo com sucesso."
              exit 0
            fi

            echo "Push recusado. Nova tentativa: $tentativa"
            sleep 2
          done

          echo "Nao foi possivel salvar o historico apos 3 tentativas."
          exit 1
