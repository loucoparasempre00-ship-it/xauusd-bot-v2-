
name: Integracao XAUUSD Bot V2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: integracao-xauusd-bot-v2
  cancel-in-progress: false

jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verificar segredos
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TWELVE_DATA_API_KEY" || {
            echo "::error::Falta TWELVE_DATA_API_KEY"
            exit 1
          }
          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "::error::Falta TELEGRAM_BOT_TOKEN"
            exit 1
          }
          test -n "$TELEGRAM_CHAT_ID" || {
            echo "::error::Falta TELEGRAM_CHAT_ID"
            exit 1
          }
          echo "Segredos obrigatorios encontrados."
  
      - name: 1 - Cronometro de fechamento M5
        run: |
          python -u - <<'PY'
          import time
          from datetime import datetime, timezone, timedelta

          agora = datetime.now(timezone.utc)

          # Ultimo fechamento M5, com margem de 3 segundos.
          minuto_base = (agora.minute // 5) * 5
          ultimo_fechamento = agora.replace(
              minute=minuto_base,
              second=3,
              microsecond=0
          )

          # Se ja passou pelo fechamento, aproveita os dados
          # mais recentes, sem esperar outros cinco minutos.
          if agora >= ultimo_fechamento:
              espera = 0
              alvo = ultimo_fechamento
              motivo = "Fechamento M5 ja ocorreu: iniciar imediatamente."
          else:
              # Ainda nao chegou ao fechamento atual.
              alvo = ultimo_fechamento
              espera = (alvo - agora).total_seconds()
              motivo = "Aguardando fechamento M5."

          print(f"Inicio UTC: {agora.isoformat()}")
          print(f"Alvo UTC: {alvo.isoformat()}")
          print(f"Motivo: {motivo}")
          print(f"Espera calculada: {espera:.1f} segundos")

          if espera > 0:
              time.sleep(espera)

          print(
              "Cronometro concluido UTC:",
              datetime.now(timezone.utc).isoformat()
          )
          PY

      

      - name: 2 - Coletar candles
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -u coletar_candles.py

      - name: 3 - Filtrar candles fechados
        run: python -u filtro_candles_fechados.py

      - name: 4 - Validar mercado
        run: python -u validador_mercado.py

      - name: 5 - Motor matematico
        run: python -u motor_matematico.py

      - name: 6 - Leitura do mercado
        run: python -u leitura_mercado.py

      - name: 7 - Gerar candidato
        run: python -u gerador_candidatos.py

      - name: 8 - Validar sinal
        run: python -u validador_sinais_ia.py

      - name: 9 - Decisor final
        continue-on-error: true
        run: python -u decisor_final.py

      - name: Diagnostico final
        if: always()
        run: |
          echo "Execucao finalizada."
          echo "Confira acima a primeira etapa que apresentou X vermelho."

      - name: Publicar candles fechados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candles-xauusd-m5
          path: data/xauusd_m5_fechados.csv
          if-no-files-found: error
          retention-days: 2
