
name: Transmitir Bancos para Gestor XAUUSD

on:
  workflow_run:
    workflows:
      - Central Inteligente XAUUSD
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: transmitir-bancos-gestor
  cancel-in-progress: false

jobs:
  transmitir:
    name: Preparar fila e transmitir um bloco
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Baixar repositorio Central
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar fila da execucao anterior
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATUAL: ${{ github.run_id }}
        run: |
          set -e
          mkdir -p data

          PREVIOUS_RUN_ID=$(gh run list \
            --workflow transmitir-bancos-gestor.yml \
            --limit 30 \
            --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != ${RUN_ATUAL})] | sort_by(.createdAt) | last | .databaseId // empty")

          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "Recuperando fila da execução $PREVIOUS_RUN_ID"

            gh run download "$PREVIOUS_RUN_ID" \
              --name fila-progressiva-gestor \
              --dir data

            test -s data/fila_progressiva_gestor.db
            echo "FILA ANTERIOR RECUPERADA."
          else
            echo "Nenhuma fila anterior encontrada. Inicializando fila."
          fi

      - name: Verificar arquivos e bancos
        run: |
          set -e

          test -s integracao_gestor_bancos.py
          test -s fila_progressiva_gestor.py
          test -s data/graficos.db.gz
          test -s data/estatisticas_m5.db.gz

          python -m py_compile integracao_gestor_bancos.py
          python -m py_compile fila_progressiva_gestor.py

      - name: Preparar e atualizar tabela progressiva
        run: |
          set -e
          python fila_progressiva_gestor.py preparar
          python fila_progressiva_gestor.py resumo

      - name: Transmitir somente um bloco
        env:
          GESTOR_XAUUSD_URL: ${{ secrets.GESTOR_XAUUSD_BANCOS_URL }}
          GESTOR_XAUUSD_TOKEN: ${{ secrets.GESTOR_XAUUSD_TOKEN }}
        run: |
          set -e
          test -n "$GESTOR_XAUUSD_URL"
          test -n "$GESTOR_XAUUSD_TOKEN"

          python integracao_gestor_bancos.py

      - name: Salvar fila para a proxima execucao
        if: always() && hashFiles('data/fila_progressiva_gestor.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fila-progressiva-gestor
          path: data/fila_progressiva_gestor.db
          if-no-files-found: error
          retention-days: 90

      - name: Resultado
        if: always()
        run: |
          echo "TRANSMISSAO PROGRESSIVA CENTRAL -> GESTOR"
          echo "Até 3 registros novos e 3 antigos por execução."
          echo "Um único bloco por execução."
          echo "Confirmação antes de consumir."
          echo "Fila preservada para a próxima execução."
