
name: Transmitir Bancos para Gestor XAUUSD

on:
  workflow_run:
    workflows:
      - Central Inteligente XAUUSD
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: transmitir-bancos-gestor
  cancel-in-progress: false

jobs:
  transmitir:
    name: Transmitir bancos oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Baixar repositorio Central atualizado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivos e bancos
        run: |
          set -e
          test -s integracao_gestor_bancos.py
          test -s data/graficos.db.gz
          test -s data/estatisticas_m5.db.gz
          python -m py_compile integracao_gestor_bancos.py

      - name: Transmitir bancos para o Gestor
        env:
          GESTOR_XAUUSD_URL: ${{ secrets.GESTOR_XAUUSD_BANCOS_URL }}
          GESTOR_XAUUSD_TOKEN: ${{ secrets.GESTOR_XAUUSD_TOKEN }}
        run: |
          set -e
          test -n "$GESTOR_XAUUSD_URL"
          test -n "$GESTOR_XAUUSD_TOKEN"
          python integracao_gestor_bancos.py

      - name: Resultado da transmissao
        if: always()
        run: |
          echo "TRANSMISSAO CENTRAL -> GESTOR"
          echo "Modo: somente leitura"
