name: Backtest XAUUSD

on:
workflow_dispatch:
inputs:
quantidade:
description: "Quantidade de candles para testar"
required: true
default: "500"
type: string

permissions:
contents: read

jobs:
backtest:
runs-on: ubuntu-latest
steps:
- name: Baixar repositorio
uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Mostrar configuracao do teste
    env:
      QUANTIDADE: ${{ inputs.quantidade }}
    run: |
      echo "Backtest solicitado."
      echo "Quantidade de candles: $QUANTIDADE"
      echo "Este workflow ainda precisa ser conectado ao script de backtest existente."
